frost_guide:
  book_title: "Panduan Dunia Beku"
  book_author: "Kartografer Musim Aeternum"

  page1: |
    §9Alam Embun Beku Abadi
    §7Anda telah melewati portal glowstone dan tiba
    di alam musim dingin tanpa akhir.
    
    §1Anda dapat membangun markas, menambang, dan menjelajah,
    §4tetapi ingat musuh lebih kuat§7.
  

  page2: |
    §9Bahaya es
    
    §7Di Alam Embun Beku Abadi, hampir setiap musuh memiliki
    varian beku.
    
    §4Terus bergerak dan selalu bawa
    baju besi dan makanan yang baik.

  page3: |
    §9Glacialis, Jantung Musim Dingin
    
    §7Bos ini adalah alasan dimensi ini
    terperangkap dalam musim dingin abadi.
    §4Glacialis muncul di malam hari di Alam Embun Beku Abadi,
    setiap §628 hari§7.
    Loot-nya istimewa untuk baju besi Embun Beku Abadi.

  page4: |
    §6Helm Embun Beku Abadi
    §7Resep:
    §2[S] [S] [S]
    §2[S] [C] [S]
    §2[ ] [H] [ ]
    
    §1S = Pecahan Es Abadi
    §1C = Inti Glacialis
    §1H = Helm Berlian
    
    §7Helm Embun Beku Abadi adalah bagian pertama untuk
    menghadapi panas neraka.

  page5: |
    §6Pelat Dada Embun Beku Abadi
    §7Resep:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Pecahan Es Abadi
    §1C = Inti Glacialis
    §1A = Pelat Dada Berlian
    
    §7Pelat Dada Embun Beku Abadi memperkuat tubuh Anda.

  page6: |
    §6Pelindung Kaki Embun Beku Abadi
    §7Resep:
    §2[S] [C] [S]
    §2[S] [A] [S]
    §2[S] [A] [S]
    
    §1S = Pecahan Es Abadi
    §1C = Inti Glacialis
    §1A = Celana Berlian
    
    §7Mereka dimaksudkan untuk medan yang membakar.

  page7: |
    §6Sepatu Bot Embun Beku Abadi
    §7Resep:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Pecahan Es Abadi
    §1C = Inti Glacialis
    §1A = Sepatu Bot Berlian
    
    §7Sepatu bot sangat penting untuk
    menahan panas.

  page8: |
    §4Dimensi berikutnya
    §7Dunia yang terlupakan dan §Dimakan oleh Nether§7 
    yang mengarah ke alam panas neraka.
    
    §7Di sana musuh bahkan lebih kuat, dengan
    kesehatan dan kerusakan yang berlipat ganda.
    
    §7Dengan set Embun Beku Abadi penuh
    Anda akan siap untuk api neraka.

  page9: |
    §4Alam Berbara
    §7Konstruksi:
    §2[W] [W] [W] [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [W] [W] [W]
    
    §1W = Blok Nether Wart
    §1Nyalakan dengan korek api dan baja

  page10: |
    §4Alam Berbara
    Anda hanya bisa mencapai tempat ini dengan baju besi Embun Beku Abadi.
    Jika Anda memutuskan untuk masuk tanpanya, Anda akan terbakar sampai mati.

guide_heat:
  book_title: "Panduan Bertahan Hidup Berbara"
  book_author: "Arsip Aeternum"

  page1: |
    §4§lALAM BERBARA
    §cAnda telah melintasi ke Alam Berbara.

    §6Di sini udara membakar, batu mengeluarkan api
    dan tidak ada yang ingin Anda tetap hidup.
    §4Alam ini mungkin menjadi akhir dari perjalanan Anda…
    §c…atau tempat Anda dilahirkan kembali dalam api.

  page2: |
    §6§lBERTAHAN HIDUP DASAR

    §8• §cPanas konstan §6akan menghabiskan Anda
    tanpa perlindungan yang tepat.
    §8• §6Jangan pernah datang tanpa §amakanan§6, §abalok §6dan
    §aramuan §6yang siap.
    §8• §cJangan datang sendirian §6jika Anda belum tahu
    rahasia alam ini.

  page3: |
    §3§lBAJU BESI TEMPA MUSIM DINGIN

    §6Hanya set §1Embun Beku Abadi §6lengkap yang dapat menahan
    iklim ekstrem.
    §cTanpa set§6, api dan lahar
    akan melelehkan Anda tanpa ampun.
    §1Dengan itu§6, Anda dapat berjalan melalui api
    seolah-olah itu adalah batu padat.

  page4: |
    §4§lMAKHLUK ALAM

    §8• §6Mob di sini kira-kira
    §c4 kali lebih kuat.
    §8• §6Mereka memiliki §clebih banyak kesehatan§6, §clebih banyak kerusakan §6dan hampir
    semuanya memberikan §ckerusakan api§6.
    §8• §6Ada varian api.
    §cjika Anda meremehkannya, Anda mati.

  page5: |
    §6§lLOOT DAN RISIKO

    §8• §6Reruntuhan dan menara menyembunyikan perlengkapan dengan
    mantra jauh di atas normal.
    §8• §6Ini adalah loot terbaik di §5Aeternum§6
    §aJika Anda sudah sejauh ini, Anda sudah membuktikan keberanian Anda.
    §2Sekarang buktikan Anda mampu
    untuk kembali hidup.

