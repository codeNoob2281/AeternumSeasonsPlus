guide_food:
  title: "&6Buku Masak Aeternum"
  author: "&aKoki Pengembara"

  page1: |
    &0&lBuku Masak Aeternum

    &0Buku kecil ini mengumpulkan
    &0beberapa resep favorit
    &0dari petani
    &0dan pelancong.

    &0Tanaman musiman baru:

    &cTomat&0 – berair dan
    &0segar, enak dalam salad
    &0dan sandwich.

    &6Bawang&0 – bau kuat
    &0tetapi sempurna untuk semur
    &0dan roti.

    &6Nasi&0 – ditanam di air.
    &0Tanam benih di
    &0kolam dangkal untuk mendapatkan
    &0batang nasi.

  page2: |
    &0&lHidangan Dasar

    &6Salad Tomat&0
    &7Mangkuk + 2x Tomat
    &0Salad ringan yang
    &0memulihkan sedikit rasa lapar
    &0dan memberikan sedikit
    &0regenerasi.

    &6Roti Sayuran&0
    &7Roti + Tomat + Bawang
    &0Roti yang mengenyangkan diisi
    &0dengan sayuran musiman.
    &0Memberikan perisai kecil
    &0hati penyerapan.

    &6Sandwich Daging&0
    &7Roti + daging matang +
    &7Tomat + Bawang
    &0Sandwich mengenyangkan yang
    &0memberikan resistensi dan
    &0kekuatan ekstra.

  page3: |
    &0&lNasi dan Semur

    &6Menanam Nasi&0
    &0Benih nasi dapat ditanam
    &0di air yang diam. Mereka tumbuh
    &0sebagai batang tinggi, seperti rumput laut.

    &0Memecah batang menghasilkan
    &0lebih banyak benih nasi untuk ditanam
    &0lagi.

    &6Semur Daging Sapi Nasi&0
    &7Mangkuk + daging matang +
    &7Nasi
    &0Semur hangat yang mengisi
    &0banyak rasa lapar, memulihkan
    &0kesehatan seiring waktu dan
    &0secara singkat meningkatkan saturasi.

  page4: |
    &0&lMinuman

    &6Kopi&0
    &7Botol + Kakao + Gula
    &0Panas dan pahit. Menghilangkan
    &0pembekuan, memberikan kecepatan
    &0dan penglihatan malam untuk
    &0sementara.

    &6Teh Herbal&0
    &7Botol + bunga hutan
    &0Infusi menenangkan yang
    &0dengan lembut menyembuhkan, membantu
    &0melawan dingin dan
    &0memberikan dorongan kesehatan kecil.

    &6Minuman Energi&0
    &7Botol + Gula + Redstone
    &7+ Debu Glowstone
    &0Sangat manis dan bersoda.
    &0Memberikan kecepatan dan
    &0tergesa-gesa yang kuat untuk waktu yang singkat.

    &6Cokelat Panas&0
    &7Botol + Kakao + Susu
    &0Sempurna untuk malam
    &0musim dingin. Menghangatkan Anda,
    &0memblokir pembekuan dan memberikan
    &0resistensi dan penyerapan.

  page5: |
    &6Tanah Subur&0
    Resep pupuk kaya:

      §2[T] [R] [R]
      §2[W] [W] [B]
      §2[B] [B] [B]

    T = Tanah
    R = Daging busuk
    W = Gandum
    B = Tepung tulang

    &7Konon, seorang juru masak keliling menemukan cara membuat tanamannya tumbuh jauh lebih cepat berkat pupuk khusus ini.&0
    &cIkuti resep ini untuk menyiapkan kompos mentah:&0
    &7jika kamu membiarkannya di dalam air selama dua hari,
    kompos itu akan berubah menjadi tanah yang sangat subur untuk bertani.&0  

