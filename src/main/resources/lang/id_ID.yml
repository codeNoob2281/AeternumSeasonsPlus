guide:
  # Título general (se usa tanto en chat como en el libro)
  title: "Panduan Musim Aeternum"

  # Título y autor del libro escrito
  book_title: "Panduan Musim Aeternum"
  book_author: "Aeternum"
  book_given: "Panduan musim telah diberikan padamu."

  # Línea con la estación actual
  current: "Musim Saat Ini: {season}"

  # Primer párrafo del libro
  intro: "Panduan ini merangkum cuaca, event, tanaman, dan migrasi hewan untuk setiap musim."

  section:
    events: "§0Event Musiman"
    crops: "§0Tanaman per Musim"
    migration: "§0Migrasi Hewan"
    stables: "Kandang dan Lumbung"
    weather: "§0Cuaca Khas"
    crafting: "Crafting Khusus"
    dimensions: "Dimensi"

  crafting: # <- Y AQUÍ DENTRO tus recetas
    advanced_composter: |
      §6Pengompos Lanjutan§7
      §7Resep:
      §2[L] [H] [L]
      §2[P] [C] [P]
      §2[L] [H] [L]
      §1L = daun apa saja
      §1H = hopper
      §1P = labu
      §1C = pengompos

    harvest_hoe: |
      §6Cangkul Panen§7
      §7Resep:
      §2[W] [W] [W]
      §2[E] [H] [E]
      §2[E] [E] [E]
      §1W = gandum
      §1E = zamrud
      §1H = cangkul apa saja

    farmer_boots: |
      §6Sepatu Bot Petani§7
      §7Resep:
      §2[W] [B] [W]
      §2[W] [S] [W]
      §2[W] [W] [W]
      §1W = gandum
      §1B = sepatu bot
      §1S = sekop (batu/berlian)

    lunar_lantern: |
      §6Lentera Bulan§7
      §7Resep:
      §2[R] [L] [R]
      §2[R] [E] [R]
      §2[R] [L] [R]
      §1R = redstone
      §1L = lentera
      §1E = mutiara Ender

    solar_torch: |
      §6Obor Surya§7
      §7Resep:
      §2[B] [B] [B]
      §2[ ] [T] [ ]
      §2[ ] [F] [ ]
      §1B = bubuk blaze
      §1T = obor biasa
      §1F = Bunga Matahari

    spring_bell: |
      §dBel Musim Semi§7
      §7Resep:
      §2[A] [P] [A]
      §2[P] [B] [P]
      §2[A] [P] [A]
      §1A = pecahan amethyst
      §1P = kelopak / bunga merah muda
      §1B = bel

    spring_boots: |
      §dSepatu Langkah Musim Semi§7
      §7Resep:
      §2[P] [P] [P]
      §2[P] [B] [P]
      §2[P] [P] [P]
      §1P = kelopak / bunga merah muda
      §1B = sepatu bot

    snow_boots: |
      §6Sepatu Bot Anti-Salju§7
      §7Resep:
      §2[ ] [B] [ ]
      §2[ ] [S] [ ]
      §2[ ] [S] [ ]
      §1B = sepatu bot
      §1S = ember Salju Bubuk

    woodcutter_axe: |
      §6Kapak Penebang Alami§7
      §7Resep:
      §2[L] [A] [L]
      §2[O] [ ] [O]
      §2[L] [ ] [L]
      §1L = daun apa saja
      §1O = batang kayu apa saja
      §1A = kapak apa saja

    frost_core: |
      §6Inti Musim Dingin§7
      §7Resep:
      §2[S] [I] [S]
      §2[I] [B] [I]
      §2[S] [I] [S]
      §1S = Blok salju
      §1I = Es padat
      §1B = Hati Laut
      §7Klik kanan pada Golem Salju untuk meningkatkannya.

    guardian_core: |
      §6Inti Penjaga§7
      §7Resep:
      §2[I] [B] [I]
      §2[B] [G] [B]
      §2[I] [B] [I]
      §1I = Blok besi
      §1B = Batang besi
      §1G = Pecahan amethyst
      §7Klik kanan pada Golem Besi.

    fish_trap: |
      §6Perangkap Ikan§7
      §7Resep:
      §2[S] [ ] [S]
      §2[S] [B] [S]
      §2[S] [ ] [S]
      §1S = tali
      §1B = tong

    creature_generator: |
      §6Perangkap Makhluk§7
      §7Resep:
      §2[S] [I] [S]
      §2[I] [T] [I]
      §2[S] [I] [S]
      §1S = tali
      §1I = batang besi
      §1T = tongkat

    Clock: |
      §6Jam Musiman§7
      §7Resep:
      §2[ ] [B] [ ]
      §2[ ] [R] [ ]
      §2[ ] [ ] [ ]
      §1B = Kompas
      §1R = Jam


