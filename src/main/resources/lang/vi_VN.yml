    defeated: "&b[Glacialis]&7 đã bị đánh bại. &7Các mảnh băng giá của hắn nằm rải rác trong tuyết."

frost_guide:
  book_title: "Hướng dẫn Thế giới Băng giá"
  book_author: "Người vẽ bản đồ Aeternum Seasons"

  page1: |
    §9Vương Quốc Băng Vĩnh Cửu
    §7Bạn đã băng qua cổng phát sáng và đến
    một vương quốc của mùa đông vĩnh cửu.
    
    §1Bạn có thể xây dựng căn cứ, khai thác và khám phá,
    §4nhưng hãy nhớ kẻ thù mạnh hơn§7.
  

  page2: |
    §9Nguy hiểm của băng
    
    §7Trong Vương Quốc Băng Vĩnh Cửu, hầu hết mọi kẻ thù đều có
    các biến thể bị đóng băng.
    
    §4Hãy tiếp tục di chuyển và luôn mang theo
    áo giáp và thức ăn tốt.

  page3: |
    §9Glacialis, Trái Tim Mùa Đông
    
    §7Boss này là lý do chiều không gian này bị
    mắc kẹt trong mùa đông vĩnh cửu.
    §4Glacialis xuất hiện vào ban đêm trong Vương Quốc Băng Vĩnh Cửu,
    mỗi §628 ngày§7.
    Chiến lợi phẩm của hắn đặc biệt cho áo giáp Băng Vĩnh Cửu.

  page4: |
    §6Mũ Băng Vĩnh Cửu
    §7Công thức:
    §2[S] [S] [S]
    §2[S] [C] [S]
    §2[ ] [H] [ ]
    
    §1S = Mảnh Băng Vĩnh Cửu
