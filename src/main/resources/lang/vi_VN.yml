    chịu đựng sức nóng.

  page8: |
    §4Chiều không gian tiếp theo
    §7Một thế giới bị lãng quên và §4bị Nether nuốt chửng§7 
    dẫn đến một vương quốc của sức nóng địa ngục.
    
    §7Ở đó, kẻ thù thậm chí còn mạnh hơn, với
    máu và sát thương được nhân lên.
    
    §7Với bộ Băng Vĩnh Cửu đầy đủ
    bạn sẽ sẵn sàng cho ngọn lửa địa ngục.

  page9: |
