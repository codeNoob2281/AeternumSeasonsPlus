  page10: |
    §4Vương Quốc Lửa Than
    Bạn chỉ có thể đến nơi này với áo giáp Băng Vĩnh Cửu.
    Nếu bạn quyết định vào mà không có nó, bạn sẽ bị thiêu chết.

guide_heat:
  book_title: "Hướng dẫn Sinh tồn Lửa Than"
  book_author: "Kho lưu trữ Aeternum"

  page1: |
    &0&lVƯƠNG QUỐC LỬA THAN
    §cBạn đã băng qua Vương Quốc Lửa Than.

    §6Ở đây không khí bốc cháy, đá chảy máu lửa
    và không có gì muốn bạn sống sót.
    §4Vương quốc này có thể là sự kết thúc hành trình của bạn…
    §c…hoặc nơi bạn được tái sinh trong ngọn lửa.

  page2: |
    §6&lSINH TỒN CƠ BẢN

    §8• §cSức nóng liên tục §6sẽ tiêu diệt bạn
    nếu không có sự bảo vệ thích hợp.
    §8• §6Đừng bao giờ đến mà không có §athức ăn§6, §akhối xây§6 và
    §abình thuốc§6 sẵn sàng.
    §8• §cĐừng đi một mình §6nếu bạn vẫn chưa biết
    những bí mật của vương quốc này.

  page3: |
    §3&lÁO GIÁP RÈN TỪ MÙA ĐÔNG

    §6Chỉ bộ §1Băng Vĩnh Cửu §6đầy đủ mới có thể chịu được
    khí hậu khắc nghiệt.
    §cNếu không có bộ áo giáp§6, lửa và dung nham
    sẽ làm bạn tan chảy không thương tiếc.
    §1Với nó§6, bạn có thể đi xuyên qua ngọn lửa
    như thể chúng là đá cứng.

  page4: |
    §4&lSINH VẬT CỦA VƯƠNG QUỐC

    §8• §6Quái vật ở đây mạnh hơn xấp xỉ
    §c4 lần.
    §8• §6Chúng có §cnhiều máu hơn§6, §cnhiều sát thương hơn §6và hầu hết
    tất cả đều gây §csát thương lửa§6.
    §8• §6Có các biến thể lửa.
    §cnếu bạn đánh giá thấp chúng, bạn sẽ chết.

  page5: |
    §6&lCHIẾN LỢI PHẨM VÀ RỦI RO

    §8• §6Tàn tích và tháp ẩn chứa trang bị với
    phù phép cao hơn mức bình thường.
    §8• §6Đây là chiến lợi phẩm tốt nhất ở §5Aeternum§6
    §aNếu bạn đã đi xa đến mức này, bạn đã chứng minh lòng dũng cảm của mình.
    §2Bây giờ hãy chứng minh bạn có khả năng
    trở về an toàn.

