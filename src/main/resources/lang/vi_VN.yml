    lore1: "&7Bạn không giẫm nát &6đất đã cày&7 khi nhảy."
    lore2: "&7Bạn di chuyển nhanh hơn trên &6đất nông nghiệp&7."
    lore3: "&7Đôi khi cấp &athêm hạt giống&7 khi thu hoạch."

  spring_stride_boots:
    name: "&dBước nhảy Mùa Xuân"
    lore1: "&7Một bước nhảy &dnở hoa&7, nhẹ nhàng hơn."
    lore2: "&7Khi tiếp đất, bước chân của bạn làm &fhoa&7 nở."
    lore3: "&7Hoàn hảo để khám phá đồng cỏ mùa xuân."

  solar_torch:
    name: "&eNgọn đuốc Mặt trời"
    lore1: "&7Một ngọn đuốc được &6mặt trời&7 ban phước."
    lore2: "&7Vào mùa hè, nó tăng tốc độ phát triển của cây trồng."
    lore3: "&7Vào ban đêm, nó làm suy yếu quái vật gần đó."

  advanced_composter:
    name: "&6Máy ủ Phân Nâng cao"
    lore1: "&7Xử lý phân ủ &enhanh gấp đôi&7."
    lore2: "&7Có cơ hội tạo ra &fthêm bột xương&7."
    lore3: "&7Hoạt động tốt hơn nữa vào &6mùa thu&7."

  spring_bell:
    name: "&dChuông Mùa Xuân"
    lore1: "&7Khi rung, nó làm cây trồng gần đó nở hoa."
    lore2: "&7Làm dịu và ban phước cho &eong&7 gần đó."
    lore3: "&7Phép thuật của nó mạnh hơn vào &amùa xuân&7."

  lunar_lantern:
    name: "&9Đèn lồng Mặt trăng"
    lore1: "&7Phát sáng với ánh sáng &9xanh lam&7 vào ban đêm."
    lore2: "&7Tăng cường sự phát triển của &3nấm&7 và cây tối."
    lore3: "&7Thêm một chút &bsự rõ ràng về đêm&7 cho du khách."

  harvest_hoe:
    name: "&6Cuốc Thu hoạch"
    lore1: "&7Thu hoạch cây trồng &etrong khu vực&7, chỉ khi trưởng thành."
    lore2: "&7Tự động trồng lại bằng &fhạt giống&7 trong hành trang."
    lore3: "&7Tiêu tốn độ bền cho mỗi cây trồng được thu hoạch."

  natural_tree_axe:
    name: "&2Rìu Đốn Cây Tự nhiên"
    lore1: "&7Đốn &otoàn bộ cây&7 chỉ bằng một cú vung."
    lore2: "&7Chỉ ảnh hưởng đến các khúc gỗ được kết nối, bảo tồn rừng."
    lore3: "&7Tiêu tốn độ bền cho mỗi khúc gỗ được chặt."

  frost_core:
    name: "&bLõi Mùa Đông"
    lore1: "&7Trao quyền cho một Snow Golem."
    lore2: "&7Sức mạnh của nó tăng lên nhiều hơn vào mùa đông."
    lore3: "&eNhấp chuột phải vào Snow Golem."
    lore4: "&aMùa Đông:&7 nhiều máu hơn và cầu tuyết mạnh hơn."
    lore5: "&7Không để lại tuyết trên mặt đất và không chết vì thời tiết."

  guardian_core:
    name: "&6Lõi Người bảo vệ"
    lore1: "&7Truyền sức mạnh cho một Iron Golem"
    lore2: "&7với sức mạnh gắn liền với các mùa."
    lore3: "&eNhấp chuột phải vào Iron Golem."
    lore4: "&aMùa Đông:&7 nhiều máu và sát thương hơn."
    lore5: "&eMùa Hè:&7 miễn nhiễm với lửa và đốt cháy kẻ thù."

  everfrost_shard:
    name: "&bMảnh Băng Vĩnh Cửu"
    lore_line1: "&7Một mảnh vỡ sức mạnh của &bGlacialis&7."
    lore_line2: "&7Dùng để rèn áo giáp chống lại sức nóng địa ngục."

  glacialis_core:
    name: "&3Lõi Glacialis"
    lore_line1: "&7Nó rung động với cái lạnh không tự nhiên."
    lore_line2: "&7Chìa khóa để rèn áo giáp chống lại sức nóng."

  heat_armor:
    helmet:
      name: "&bMũ Băng Vĩnh Cửu"
      lore_line1: "&7Được rèn bằng sức mạnh của &bGlacialis&7."
      lore_line2: "&7Giúp chống lại sức nóng địa ngục."
    chest:
      name: "&bÁo giáp Băng Vĩnh Cửu"
      lore_line1: "&7Băng vĩnh cửu bảo vệ trái tim bạn."
      lore_line2: "&7Giúp chống lại sức nóng địa ngục."
    legs:
      name: "&bGiáp chân Băng Vĩnh Cửu"
      lore_line1: "&7Cho phép bạn sải bước qua than hồng."
      lore_line2: "&7Giúp chống lại sức nóng địa ngục."
    boots:
      name: "&bGiày Băng Vĩnh Cửu"
      lore_line1: "&7Để lại dấu chân trên dung nham."
      lore_line2: "&7Giúp chống lại sức nóng địa ngục."

