    SUMMER: "Dưa hấu, mía, xương rồng, và cây trồng chịu nhiệt phát triển tốt nhất."
    AUTUMN: "Bí ngô, nấm và cây lấy củ; lý tưởng cho thu hoạch lớn và lưu trữ."
    WINTER: "Hầu như không có gì phát triển ngoài trời; nhà kính cho phép tiếp tục trồng trọt."

  migration:
    SPRING: "Nhiều cừu, ong và thỏ hơn ở đồng cỏ và rừng hoa."
    SUMMER: "Nhiều cá nhiệt đới, cá heo, rùa và axolotl hơn ở biển ấm."
    AUTUMN: "Cáo, sói và dê tập trung ở taiga và các khu vực miền núi."
    WINTER: "Sói và gấu bắc cực thống trị quần xã sinh vật lạnh; nhiều động vật khí hậu ấm áp biến mất."

  stables:
    winter: "Động vật không chịu lạnh có thể chết nếu chúng không có chuồng hoặc nơi trú ẩn."
    breeding: "Sinh sản kém hiệu quả (hoặc không có) nếu chúng không ở trong chuồng."
    bonus_drops: "Động vật được nuôi hoặc bảo vệ trong chuồng sẽ rơi ra nhiều vật phẩm hơn (thịt, lông, len, da)."

  weather:
    SPRING: "Mưa nhẹ, thời tiết ôn hòa và ngày dài hơn có lợi cho cây trồng."
    SUMMER: "Nắng gắt, nóng mạnh và một số cơn bão dữ dội."
    AUTUMN: "Gió mát, trời nhiều mây và thay đổi nhiệt độ đột ngột."
    WINTER: "Tuyết thường xuyên, lạnh cực độ và nguy cơ đóng băng nếu bạn không tự bảo vệ mình."

  footer: " sử dụng /seasonguide."

item:
  snow_step_boots:
