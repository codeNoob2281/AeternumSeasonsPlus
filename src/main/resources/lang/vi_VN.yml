guide_food:
  title: "&6Sách dạy nấu ăn Aeternum"
  author: "&aĐầu bếp Lang thang"

  page1: |
    &0&lSách dạy nấu ăn Aeternum

    &0Cuốn sách nhỏ này tập hợp
    &0một số công thức yêu thích
    &0của nông dân và khách du lịch.

    &0Cây trồng theo mùa mới:

    &cCà chua&0 – mọng nước và
    &0tươi mới, tuyệt vời cho salad
    &0và bánh sandwich.

    &6Hành tây&0 – mùi mạnh
    &0nhưng hoàn hảo cho món hầm
    &0và bánh mì.

    &6Gạo&0 – trồng trong nước.
    &0Trồng hạt giống trong
    &0ao cạn để thu được
    &0thân lúa.

  page2: |
    &0&lCác món ăn cơ bản

    &6Salad Cà chua&0
    &7Bát + 2x Cà chua
    &0Một món salad nhẹ
    &0phục hồi một chút cơn đói
    &0và mang lại một chút
    &0hồi phục.

    &6Bánh mì Rau củ&0
    &7Bánh mì + Cà chua + Hành tây
    &0Một ổ bánh mì đầy đặn nhồi
    &0rau theo mùa.
    &0Cấp một lá chắn nhỏ
    &0máu hấp thụ.

    &6Bánh sandwich Thịt&0
    &7Bánh mì + thịt nấu chín +
    &7Cà chua + Hành tây
    &0Một chiếc bánh sandwich thịnh soạn
    &0mang lại kháng cự và
    &0thêm sức mạnh.

  page3: |
    &0&lCơm và món hầm

    &6Trồng lúa&0
    &0Hạt lúa có thể được trồng
    &0trên mặt nước tĩnh. Chúng mọc
    &0thành thân cao, giống như rong biển.

    &0Phá vỡ thân cây sẽ tạo ra
    &0thêm hạt lúa để trồng
    &0lại.

    &6Món hầm Thịt bò Gạo&0
    &7Bát + thịt nấu chín +
    &7Gạo
    &0Một món hầm ấm áp lấp đầy
    &0rất nhiều cơn đói, phục hồi
    &0máu theo thời gian và
    &0tăng nhẹ độ bão hòa.

  page4: |
    &0&lĐồ uống

    &6Cà phê&0
    &7Chai + Ca cao + Đường
    &0Nóng và đắng. Loại bỏ
    &0đóng băng, cấp tốc độ
    &0và tầm nhìn ban đêm trong
    &0một thời gian.

    &6Trà Thảo dược&0
    &7Chai + hoa rừng
    &0Nước sắc làm dịu
    &0hồi phục nhẹ nhàng, giúp
    &0chống lại cái lạnh và
    &0tăng một chút máu.

    &6Nước tăng lực&0
    &7Chai + Đường + Đá đỏ
    &7+ Bột đá phát sáng
    &0Rất ngọt và sủi bọt.
    &0Cấp tốc độ và
    &0hối hả mạnh mẽ trong thời gian ngắn.

    &6Sô cô la Nóng&0
    &7Chai + Ca cao + Sữa
    &0Hoàn hảo cho đêm đông.
    &0Làm ấm bạn,
    &0chặn đóng băng và cấp
    &0kháng cự và hấp thụ.

  page5: |
    &6Đất màu mỡ&0
    Công thức phân bón giàu dinh dưỡng:

      §2[T] [R] [R]
      §2[W] [W] [B]
      §2[B] [B] [B]

    T = Đất
    R = Thịt thối rữa
    W = Lúa mì
    B = Bột xương

    &7Người ta kể rằng có một đầu bếp lang thang đã khám phá ra cách làm cây trồng của mình lớn nhanh hơn nhiều nhờ một loại phân bón đặc biệt.&0
    &cHãy làm theo công thức này để chuẩn bị phân ủ thô:&0
    &7nếu bạn để nó trong nước hai ngày,
    nó sẽ biến thành lớp đất màu mỡ tuyệt vời cho việc trồng trọt.&0    

