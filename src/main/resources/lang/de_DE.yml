guide_food:
  title: "&6Aeternum Kochbuch"
  author: "&aWandernder Koch"

  page1: |
    &0&lAeternum Kochbuch

    &0Dieses kleine Buch sammelt
    &0einige der Lieblingsrezepte
    &0von Bauern
    &0und Reisenden.

    &0Neue saisonale Pflanzen:

    &cTomate&0 – saftig und
    &0frisch, großartig in Salaten
    &0und Sandwiches.

    &6Zwiebel&0 – starker Geruch
    &0aber perfekt für Eintöpfe
    &0und Brot.

    &6Reis&0 – in Wasser angebaut.
    &0Pflanze die Samen in
    &0flachen Teichen, um
    &0Reisstängel zu erhalten.

  page2: |
    &0&lGrundgerichte

    &6Tomatensalat&0
    &7Schüssel + 2x Tomate
    &0Ein leichter Salat, der
    &0etwas Hunger wiederherstellt
    &0und ein bisschen
    &0Regeneration gibt.

    &6Gemüsebrod&0
    &7Brot + Tomate + Zwiebel
    &0Ein sättigendes Brot gefüllt
    &0mit saisonalem Gemüse.
    &0Gibt einen kleinen Schild mit
    &0Absorptionsherzen.

    &6Fleisch-Sandwich&0
    &7Brot + gekochtes Fleisch +
    &7Tomate + Zwiebel
    &0Ein herzhaftes Sandwich, das
    &0Resistenz und
    &0zusätzliche Stärke gewährt.

  page3: |
    &0&lReis und Eintöpfe

    &6Reisanbau&0
    &0Reissamen können
    &0auf stehendem Wasser gepflanzt werden. Sie wachsen
    &0als hohe Stängel, wie Seetang.

    &0Das Zerschlagen des Stängels ergibt
    &0mehr Reissamen zum
    &0erneuten Pflanzen.

    &6Rindfleisch Reis-Eintopf&0
    &7Schüssel + gekochtes Fleisch +
    &7Reis
    &0Ein warmer Eintopf, der viel
    &0Hunger stillt,
    &0Gesundheit im Laufe der Zeit wiederherstellt und
    &0kurzzeitig die Sättigung erhöht.

  page4: |
    &0&lGetränke

    &6Kaffee&0
    &7Flasche + Kakao + Zucker
    &0Heiß und bitter. Entfernt
    &0Erfrierung, gewährt Geschwindigkeit
    &0und Nachtsicht für
    &0eine Weile.

    &6Kräutertee&0
    &7Flasche + Waldblume
    &0Beruhigender Aufguss, der
    &0sanft heilt, hilft
    &0gegen die Kälte und
    &0gibt einen kleinen Gesundheitsbonus.

    &6Energy-Drink&0
    &7Flasche + Zucker + Redstone
    &7+ Glowstone-Staub
    &0Sehr süß und sprudelnd.
    &0Gewährt starke Geschwindigkeit und
    &0Eile für kurze Zeit.

    &6Heiße Schokolade&0
    &7Flasche + Kakao + Milch
    &0Perfekt für Winternächte.
    &0Wärmt dich auf,
    &0blockiert Erfrierung und gibt
    &0Resistenz und Absorption.

  page5: |
    &6Nährstoffreiche Erde&0
    Rezept für hochwertigen Dünger:

      §2[T] [R] [R]
      §2[W] [W] [B]
      §2[B] [B] [B]

    T = Erde
    R = Verrottetes Fleisch
    W = Weizen
    B = Knochenmehl

    &7Man sagt, ein umherziehender Koch habe entdeckt, wie seine Feldfrüchte dank eines besonderen Düngers viel schneller wachsen.&0
    &cFolge diesem Rezept, um den Rohkompost herzustellen:&0
    &7wenn du ihn zwei Tage lang im Wasser liegen lässt,
    verwandelt er sich in eine reiche Erde, ideal für den Ackerbau.&0  

