frost_guide:
  book_title: "Führer zur Gefrorenen Welt"
  book_author: "Kartograph der Aeternum Jahreszeiten"

  page1: |
    §9Ewiger Reif-Reich
    §7Du hast das Glowstone-Portal durchquert und bist
    in einem Reich des ewigen Winters angekommen.
    
    §1Du kannst deine Basis bauen, Bergbau betreiben und erkunden,
    §4aber denke daran, die Feinde sind stärker§7.
  

  page2: |
    §9Gefahren des Eises
    
    §7Im Ewigen Reif-Reich hat fast jeder Feind
    gefrorene Varianten.
    
    §4Bleib in Bewegung und trage immer
    gute Rüstung und Essen bei dir.

  page3: |
    §9Glacialis, Herz des Winters
    
    §7Dieser Boss ist der Grund, warum diese Dimension
    in einem ewigen Winter gefangen ist.
    §4Glacialis erscheint nachts im Ewigen Reif-Reich,
    alle §628 Tage§7.
    Seine Beute ist speziell für die Ewigen Reif-Rüstung.

  page4: |
    §6Ewiger Reif-Helm
    §7Rezept:
    §2[S] [S] [S]
    §2[S] [C] [S]
    §2[ ] [H] [ ]
    
    §1S = Ewiger Eissplitter
    §1C = Glacialis Kern
    §1H = Diamanthelm
    
    §7Der Ewige Reif-Helm ist das erste Teil, um
    der infernalen Hitze zu begegnen.

  page5: |
    §6Ewiger Reif-Brustplatte
    §7Rezept:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Ewiger Eissplitter
    §1C = Glacialis Kern
    §1A = Diamant-Brustplatte
    
    §7Die Ewige Reif-Brustplatte stärkt deinen Körper.

  page6: |
    §6Ewiger Reif-Beinschienen
    §7Rezept:
    §2[S] [C] [S]
    §2[S] [A] [S]
    §2[S] [A] [S]
    
    §1S = Ewiger Eissplitter
    §1C = Glacialis Kern
    §1A = Diamant-Beinschienen
    
    §7Sie sind für sengendes Gelände gedacht.

  page7: |
    §6Ewiger Reif-Stiefel
    §7Rezept:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Ewiger Eissplitter
    §1C = Glacialis Kern
    §1A = Diamant-Stiefel
    
    §7Die Stiefel sind unerlässlich, um
    die Hitze zu ertragen.

  page8: |
    §4Die nächste Dimension
    §7Eine vergessene Welt, §Vom Nether verschlungen§7 
    die zu einem Reich infernaler Hitze führt.
    
    §7Dort sind die Feinde noch stärker, mit
    vervielfachter Gesundheit und Schaden.
    
    §7Mit dem vollen Ewigen Reif-Set
    bist du bereit für die infernalen Flammen.

  page9: |
    §4Glutgebundenes Reich
    §7Bau:
    §2[W] [W] [W] [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [W] [W] [W]
    
    §1W = Netherwarzenblock
    §1Zünde es mit einem Feuerzeug an

  page10: |
    §4Das Glutgebundene Reich
    Du kannst diesen Ort nur mit der Ewiger Reif-Rüstung erreichen.
    Wenn du beschließt, ohne sie einzutreten, wirst du verbrennen.

guide_heat:
  book_title: "Glutgebundener Überlebensführer"
  book_author: "Aeternum Archive"

  page1: |
    §4§lGLUTGEBUNDENES REICH
    §cDu bist in das Glutgebundene Reich übergegangen.

    §6Hier brennt die Luft, der Stein blutet Feuer
    und nichts will, dass du am Leben bleibst.
    §4Dieses Reich könnte das Ende deiner Reise sein…
    §c…oder der Ort, an dem du in Flammen wiedergeboren wirst.

  page2: |
    §6§lGRUNDLEGENDE ÜBERLEBEN

    §8• §cDie konstante Hitze §6wird dich verzehren
    ohne angemessenen Schutz.
    §8• §6Komm niemals ohne §aEssen§6, §aBlöcke §6und
    §aTränke §6bereit.
    §8• §cKomm nicht allein §6, wenn du die Geheimnisse
    dieses Reichs noch nicht kennst.

  page3: |
    §3§lWINTERGESCHMIEDETE RÜSTUNG

    §6Nur das vollständige §1Ewiger Reif §6-Set kann
    dem extremen Klima widerstehen.
    §cOhne das Set§6 werden dich Feuer und Lava
    gnadenlos schmelzen.
    §1Damit§6 kannst du durch die Flammen gehen,
    als wären sie fester Stein.

  page4: |
    §4§lKREATUREN DES REICHS

    §8• §6Mobs hier sind ungefähr
    §c4 mal stärker.
    §8• §6Sie haben §cmehr Gesundheit§6, §cmehr Schaden §6und fast
    alle verursachen §cFeuerschaden§6.
    §8• §6Es gibt feurige Varianten.
    §cwenn du sie unterschätzt, stirbst du.

  page5: |
    §6§lLoot und Risiko

    §8• §6Ruinen und Türme verbergen Ausrüstung mit
    Verzauberungen weit über dem Normalen.
    §8• §6Es ist der beste Loot in §5Aeternum§6
    §aWenn du es so weit geschafft hast, hast du deinen Mut bewiesen.
    §2Beweise jetzt, dass du fähig bist,
    lebend zurückzukehren.

