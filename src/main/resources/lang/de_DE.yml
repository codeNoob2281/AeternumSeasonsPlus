guide:
  # Título general (se usa tanto en chat como en el libro)
  title: "Aeternum Jahreszeiten-Führer"

  # Título y autor del libro escrito
  book_title: "Aeternum Jahreszeiten-Führer"
  book_author: "Aeternum"
  book_given: "Der Jahreszeiten-Führer wurde dir übergeben."

  # Línea con la estación actual
  current: "Aktuelle Jahreszeit: {season}"

  # Primer párrafo del libro
  intro: "Dieser Führer fasst das Wetter, Ereignisse, Anbau und Tierwanderungen für jede Jahreszeit zusammen."

  section:
    events: "§0Saisonale Ereignisse"
    crops: "§0Anbau nach Jahreszeit"
    migration: "§0Tierwanderung"
    stables: "Ställe und Scheunen"
    weather: "§0Typisches Wetter"
    crafting: "Spezielle Handwerkskunst"
    dimensions: "Dimensionen"

  crafting: # <- Y AQUÍ DENTRO tus recetas
    advanced_composter: |
      §6Fortgeschrittener Komposter§7
      §7Rezept:
      §2[L] [H] [L]
      §2[P] [C] [P]
      §2[L] [H] [L]
      §1L = beliebiges Blatt
      §1H = Trichter
      §1P = Kürbis
      §1C = Komposter

    harvest_hoe: |
      §6Ernte-Hacke§7
      §7Rezept:
      §2[W] [W] [W]
      §2[E] [H] [E]
      §2[E] [E] [E]
      §1W = Weizen
      §1E = Smaragd
      §1H = beliebige Hacke

    farmer_boots: |
      §6Bauernstiefel§7
      §7Rezept:
      §2[W] [B] [W]
      §2[W] [S] [W]
      §2[W] [W] [W]
      §1W = Weizen
      §1B = Stiefel
      §1S = Schaufel (Stein/Diamant)

    lunar_lantern: |
      §6Mondlaterne§7
      §7Rezept:
      §2[R] [L] [R]
      §2[R] [E] [R]
      §2[R] [L] [R]
      §1R = Redstone
      §1L = Laterne
      §1E = Enderperle

    solar_torch: |
      §6Solarfackel§7
      §7Rezept:
      §2[B] [B] [B]
      §2[ ] [T] [ ]
      §2[ ] [F] [ ]
      §1B = Lohenstaub
      §1T = normale Fackel
      §1F = Sonnenblume

    spring_bell: |
      §dFrühlingsglocke§7
      §7Rezept:
      §2[A] [P] [A]
      §2[P] [B] [P]
      §2[A] [P] [A]
      §1A = Amethystsplitter
      §1P = Blütenblatt / rosa Blume
      §1B = Glocke

    spring_boots: |
      §dFrühlingsschritt-Stiefel§7
      §7Rezept:
      §2[P] [P] [P]
      §2[P] [B] [P]
      §2[P] [P] [P]
      §1P = Blütenblatt / rosa Blume
      §1B = Stiefel

    snow_boots: |
      §6Anti-Schnee-Stiefel§7
      §7Rezept:
      §2[ ] [B] [ ]
      §2[ ] [S] [ ]
      §2[ ] [S] [ ]
      §1B = Stiefel
      §1S = Eimer Pulverschnee

    woodcutter_axe: |
      §6Natürliche Holzfäller-Axt§7
      §7Rezept:
      §2[L] [A] [L]
      §2[O] [ ] [O]
      §2[L] [ ] [L]
      §1L = beliebiges Blatt
      §1O = beliebiger Stamm
      §1A = beliebige Axt

    frost_core: |
      §6Winterkern§7
      §7Rezept:
      §2[S] [I] [S]
      §2[I] [B] [I]
      §2[S] [I] [S]
      §1S = Schneeblock
      §1I = Gepacktes Eis
      §1B = Herz des Meeres
      §7Rechtsklick auf einen Schneegolem, um ihn aufzuwerten.

    guardian_core: |
      §6Wächterkern§7
      §7Rezept:
      §2[I] [B] [I]
      §2[B] [G] [B]
      §2[I] [B] [I]
      §1I = Eisenblock
      §1B = Eisenbarren
      §1G = Amethystsplitter
      §7Rechtsklick auf einen Eisengolem.

    fish_trap: |
      §6Fischfalle§7
      §7Rezept:
      §2[S] [ ] [S]
      §2[S] [B] [S]
      §2[S] [ ] [S]
      §1S = Faden
      §1B = Fass

    creature_generator: |
      §6Tierfalle§7
      §7Rezept:
      §2[S] [I] [S]
      §2[I] [T] [I]
      §2[S] [I] [S]
      §1S = Faden
      §1I = Eisenbarren
      §1T = Stock

    Clock: |
      §6Jahreszeitenuhr§7
      §7Rezept:
      §2[ ] [B] [ ]
      §2[ ] [R] [ ]
      §2[ ] [ ] [ ]
      §1B = Kompass
      §1R = Uhr


