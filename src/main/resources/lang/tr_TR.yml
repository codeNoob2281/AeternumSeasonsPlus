    weather: "§0Tipik Hava Durumu"
    crafting: "Özel Üretim"
    dimensions: "Boyutlar"

  crafting: # <- Y AQUÍ DENTRO tus recetas
    advanced_composter: |
      §6Gelişmiş Kompost Kutusu§7
      §7Tarif:
      §2[L] [H] [L]
      §2[P] [C] [P]
      §2[L] [H] [L]
      §1L = herhangi bir yaprak
      §1H = huni
      §1P = balkabağı
      §1C = kompost kutusu

    harvest_hoe: |
      §6Hasat Çapası§7
      §7Tarif:
      §2[W] [W] [W]
      §2[E] [H] [E]
      §2[E] [E] [E]
      §1W = buğday
      §1E = zümrüt
      §1H = herhangi bir çapa

    farmer_boots: |
      §6Çiftçi Botları§7
      §7Tarif:
      §2[W] [B] [W]
      §2[W] [S] [W]
      §2[W] [W] [W]
      §1W = buğday
      §1B = botlar
      §1S = kürek (taş/elmas)

    lunar_lantern: |
      §6Ay Feneri§7
      §7Tarif:
      §2[R] [L] [R]
      §2[R] [E] [R]
      §2[R] [L] [R]
      §1R = redstone
      §1L = fener
      §1E = Ender incisi

    solar_torch: |
      §6Güneş Meşalesi§7
      §7Tarif:
      §2[B] [B] [B]
      §2[ ] [T] [ ]
      §2[ ] [F] [ ]
      §1B = blaze tozu
      §1T = normal meşale
      §1F = Ayçiçeği

    spring_bell: |
      §dBahar Çanı§7
      §7Tarif:
      §2[A] [P] [A]
      §2[P] [B] [P]
      §2[A] [P] [A]
      §1A = ametist parçası
      §1P = yaprak / pembe çiçek
      §1B = çan

    spring_boots: |
      §dBahar Adım Botları§7
      §7Tarif:
      §2[P] [P] [P]
      §2[P] [B] [P]
      §2[P] [P] [P]
      §1P = yaprak / pembe çiçek
      §1B = botlar

    snow_boots: |
      §6Anti-Kar Botları§7
      §7Tarif:
      §2[ ] [B] [ ]
      §2[ ] [S] [ ]
      §2[ ] [S] [ ]
      §1B = botlar
      §1S = Toz Kar kovası

    woodcutter_axe: |
      §6Doğal Oduncu Baltası§7
      §7Tarif:
      §2[L] [A] [L]
      §2[O] [ ] [O]
      §2[L] [ ] [L]
      §1L = herhangi bir yaprak
      §1O = herhangi bir kütük
      §1A = herhangi bir balta

    frost_core: |
      §6Kış Çekirdeği§7
      §7Tarif:
      §2[S] [I] [S]
      §2[I] [B] [I]
      §2[S] [I] [S]
      §1S = Kar bloğu
      §1I = Paketlenmiş buz
      §1B = Denizin Kalbi
      §7Geliştirmek için Kar Golemine sağ tıklayın.

    guardian_core: |
      §6Muhafız Çekirdeği§7
      §7Tarif:
      §2[I] [B] [I]
      §2[B] [G] [B]
      §2[I] [B] [I]
      §1I = Demir bloğu
      §1B = Demir külçesi
      §1G = Ametist parçası
      §7Demir Goleme sağ tıklayın.

    fish_trap: |
      §6Balık Tuzağı§7
      §7Tarif:
      §2[S] [ ] [S]
      §2[S] [B] [S]
      §2[S] [ ] [S]
      §1S = ip
      §1B = fıçı

    creature_generator: |
      §6Yaratık Tuzağı§7
