      §2[I] [T] [I]
      §2[S] [I] [S]
      §1S = ip
      §1I = demir külçesi
      §1T = çubuk

    Clock: |
      §6Mevsimlik Saat§7
      §7Tarif:
      §2[ ] [B] [ ]
      §2[ ] [R] [ ]
      §2[ ] [ ] [ ]
