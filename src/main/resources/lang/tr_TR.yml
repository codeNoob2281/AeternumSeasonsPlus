guide_food:
  title: "&6Aeternum Yemek Kitabı"
  author: "&aSeyahat Eden Şef"

  page1: |
    &0&lAeternum Yemek Kitabı

    &0Bu küçük kitap,
    &0çiftçilerin ve
    &0gezginlerin en sevdiği
    &0bazı tarifleri bir araya getiriyor.

    &0Yeni mevsimlik ekinler:

    &cDomates&0 – sulu ve
    &0taze, salatalar ve
    &0sandviçler için harika.

    &6Soğan&0 – keskin kokulu
    &0ama güveçler ve
    &0ekmekler için mükemmel.

    &6Pirinç&0 – suda yetiştirilir.
    &0Pirinç sapları elde etmek
    &0için tohumları sığ göletlere
    &0ekin.

  page2: |
    &0&lTemel yemekler

    &6Domates Salatası&0
    &7Kase + 2x Domates
    &0Biraz açlığı geri kazandıran
    &0ve biraz yenilenme veren
    &0hafif bir salata.

    &6Sebzeli Ekmek&0
    &7Ekmek + Domates + Soğan
    &0Mevsimlik sebzelerle doldurulmuş
    &0doyurucu bir ekmek.
    &0Küçük bir absorpsiyon canı
    &0kalkanı verir.

    &6Etli Sandviç&0
    &7Ekmek + pişmiş et +
    &7Domates + Soğan
    &0Maceracılar için direnç ve
    &0ekstra güç veren
    &0doyurucu bir sandviç.

  page3: |
    &0&lPirinç ve güveçler

    &6Pirinç ekimi&0
    &0Pirinç tohumları durgun suya
    &0ekilebilir. Su yosunu gibi
    &0uzun saplar halinde büyürler.

    &0Sapı kırmak, yeniden ekmek
    &0için daha fazla pirinç tohumu
    &0verir.

    &6Dana Etli Pirinçli Güveç&0
    &7Kase + pişmiş et +
    &7Pirinç
    &0Çok fazla açlığı gideren,
    &0zamanla canı geri kazandıran
    &0ve doygunluğu kısa süreliğine
    &0artıran sıcak bir güveç.

  page4: |
    &0&lİçecekler

    &6Kahve&0
    &7Şişe + Kakao + Şeker
    &0Sıcak ve acı. Donmayı
    &0giderir, bir süreliğine hız
    &0ve gece görüşü verir.

    &6Bitki Çayı&0
    &7Şişe + orman çiçeği
    &0Nazikçe iyileştiren, soğuğa
    &0karşı yardımcı olan ve küçük
    &0bir can takviyesi veren
    &0sakinleştirici infüzyon.

    &6Enerji İçeceği&0
    &7Şişe + Şeker + Kızıltaş
    &7+ Parlaktaş tozu
    &0Çok tatlı ve gazlı.
    &0Kısa süreliğine güçlü hız ve
    &0acele verir.

    &6Sıcak Çikolata&0
    &7Şişe + Kakao + Süt
    &0Kış geceleri için mükemmel.
    &0Sizi ısıtır, donmayı
    &0engeller ve direnç ile
    &0absorpsiyon verir.

  page5: |
    &6Verimli toprak&0
    Zengin gübre tarifi:

      §2[T] [R] [R]
      §2[W] [W] [B]
      §2[B] [B] [B]

    T = Toprak
    R = Çürük et
    W = Buğday
    B = Kemik tozu

    &7Söylentilere göre, gezgin bir aşçı özel bir gübre sayesinde mahsullerini çok daha hızlı büyütmenin yolunu keşfetmiş.&0
    &cHam kompostu hazırlamak için bu tarife uy:&0
    &7onu iki gün boyunca suda bırakırsan,
    sonrasında ekim için mükemmel, zengin bir toprağa dönüşecektir.&0    

