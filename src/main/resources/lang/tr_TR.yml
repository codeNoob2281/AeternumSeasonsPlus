frost_guide:
  book_title: "Donmuş Dünya Rehberi"
  book_author: "Aeternum Mevsimler Haritacısı"

  page1: |
    §9Ebedi Buz Diyarı
    §7Alevtaşı portalını geçtiniz ve
    sonsuz bir kış diyarına ulaştınız.
    
    §1Üssünüzü inşa edebilir, madencilik yapabilir ve keşfedebilirsiniz,
    §4ama unutmayın düşmanlar daha güçlü§7.
  

  page2: |
    §9Buzun Tehlikeleri
    
    §7Ebedi Buz Diyarında neredeyse her düşmanın
    donmuş varyantları vardır.
    
    §4Hareket etmeye devam edin ve her zaman
    iyi zırh ve yiyecek taşıyın.

  page3: |
    §9Glacialis, Kışın Kalbi
    
    §7Bu boss, bu boyutun
    sonsuz bir kışa hapsolmasının nedenidir.
    §4Glacialis, Ebedi Buz Diyarında geceleri,
    her §628 günde bir§7 ortaya çıkar.
    Ganimeti, Ebedi Buz zırhı için özeldir.

  page4: |
    §6Ebedi Buz Miğferi
    §7Tarif:
    §2[S] [S] [S]
    §2[S] [C] [S]
    §2[ ] [H] [ ]
    
    §1S = Ebedi Buz Parçası
    §1C = Glacialis Çekirdeği
    §1H = Elmas Miğfer
    
    §7Ebedi Buz Miğferi, cehennem sıcağıyla
    yüzleşmek için ilk parçadır.

  page5: |
    §6Ebedi Buz Göğüslük
    §7Tarif:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Ebedi Buz Parçası
    §1C = Glacialis Çekirdeği
    §1A = Elmas Göğüslük
    
    §7Ebedi Buz Göğüslük vücudunuzu güçlendirir.

  page6: |
    §6Ebedi Buz Zırhı
    §7Tarif:
    §2[S] [C] [S]
    §2[S] [A] [S]
    §2[S] [A] [S]
    
    §1S = Ebedi Buz Parçası
    §1C = Glacialis Çekirdeği
    §1A = Elmas Zırh
    
    §7Kavurucu araziler için tasarlanmıştır.

  page7: |
    §6Ebedi Buz Çizmesi
    §7Tarif:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Ebedi Buz Parçası
    §1C = Glacialis Çekirdeği
    §1A = Elmas Çizme
    
    §7Çizmeler, sıcağa dayanmak için
    çok önemlidir.

  page8: |
    §4Sonraki Boyut
    §7Unutulmuş ve §4Nether tarafından yutulmuş§7 bir dünya
    cehennem sıcağı diyarına götürür.
    
    §7Orada düşmanlar daha da güçlüdür, can ve
    hasarları katlanmıştır.
    
    §7Tam Ebedi Buz seti ile
    cehennem alevlerine hazır olacaksınız.

  page9: |
    §4Köz Diyarı
    §7İnşaat:
    §2[W] [W] [W] [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [W] [W] [W]
    
    §1W = Nether Siğili Bloğu
    §1Çakmak ve çelikle yakın

  page10: |
    §4Köz Diyarı
    Bu yere sadece Ebedi Buz zırhı ile ulaşabilirsiniz.
    Onsuz girmeye karar verirseniz, yanarak ölürsünüz.

guide_heat:
  book_title: "Köz Diyarı Hayatta Kalma Rehberi"
  book_author: "Aeternum Arşivleri"

  page1: |
    &0&lKÖZ DİYARI
    §cCöz Diyarı'na geçtiniz.

    §6Burada hava yakar, taş ateş kanar
    ve hiçbir şey hayatta kalmanızı istemez.
    §4Bu diyar yolculuğunuzun sonu olabilir…
    §c…veya alevlerde yeniden doğduğunuz yer olabilir.

  page2: |
    §6&lTEMEL HAYATTA KALMA

    §8• §cSürekli sıcaklık §6uygun koruma
    olmadan sizi tüketir.
    §8• §6Yanınızda §ayiyecek§6, §ablok §6ve
    §aşişeler §6hazır olmadan asla gelmeyin.
    §8• §cBu diyarın sırlarını hala bilmiyorsanız
    §6yalnız gelmeyin.

  page3: |
    §3&lKIŞ DÖVME ZIRH

    §6Sadece tam §1Ebedi Buz §6seti aşırı iklime
    dayanabilir.
    §cSet olmadan§6, ateş ve lav
    sizi acımasızca eritir.
    §1Onunla§6, alevlerin içinden
    sanki sert taşlarmış gibi yürüyebilirsiniz.

  page4: |
    §4&lDİYARIN YARATIKLARI

    §8• §6Buradaki canavarlar yaklaşık
    §c4 kat daha güçlüdür.
    §8• §6Daha §cçok can§6, daha §cçok hasar §6sahiptirler ve neredeyse
    hepsi §cateş hasarı§6 verir.
    §8• §6Ateşli varyantlar vardır.
    §cOnları küçümserseniz, ölürsünüz.

  page5: |
    §6&lGANİMET VE RİSK

    §8• §6Harabeler ve kuleler normalden çok daha yüksek büyülerle
    donatılmış ekipmanları saklar.
    §8• §5Aeternum'daki§6 en iyi ganimettir
    §aBuraya kadar geldiyseniz, cesaretinizi zaten kanıtladınız.
    §2Şimdi canlı dönüp dönemeyeceğinizi
    kanıtlayın.

