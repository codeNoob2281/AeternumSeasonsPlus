guide:
  # Título general (se usa tanto en chat como en el libro)
  title: "Гид по Временам Года Aeternum"

  # Título y autor del libro escrito
  book_title: "Гид по Временам Года Aeternum"
  book_author: "Aeternum"
  book_given: "Гид по временам года был вам выдан."

  # Línea con la estación actual
  current: "Текущее время года: {season}"

  # Primer párrafo del libro
  intro: "Этот гид суммирует погоду, события, урожаи и миграцию животных для каждого времени года."

  section:
    events: "§0Сезонные События"
    crops: "§0Урожаи по Временам Года"
    migration: "§0Миграция Животных"
    stables: "Стойла и Сараи"
    weather: "§0Типичная Погода"
    crafting: "Особый Крафтинг"
    dimensions: "Измерения"

  crafting: # <- Y AQUÍ DENTRO tus recetas
    advanced_composter: |
      §6Улучшенный Компостер§7
      §7Рецепт:
      §2[L] [H] [L]
      §2[P] [C] [P]
      §2[L] [H] [L]
      §1L = любой лист
      §1H = воронка
      §1P = тыква
      §1C = компостер

    harvest_hoe: |
      §6Мотыга Урожая§7
      §7Рецепт:
      §2[W] [W] [W]
      §2[E] [H] [E]
      §2[E] [E] [E]
      §1W = пшеница
      §1E = изумруд
      §1H = любая мотыга

    farmer_boots: |
      §6Сапоги Фермера§7
      §7Рецепт:
      §2[W] [B] [W]
      §2[W] [S] [W]
      §2[W] [W] [W]
      §1W = пшеница
      §1B = сапоги
      §1S = лопата (камень/алмаз)

    lunar_lantern: |
      §6Лунная Лампа§7
      §7Рецепт:
      §2[R] [L] [R]
      §2[R] [E] [R]
      §2[R] [L] [R]
      §1R = редстоун
      §1L = лампа
      §1E = жемчужина Края

    solar_torch: |
      §6Солнечный Факел§7
      §7Рецепт:
      §2[B] [B] [B]
      §2[ ] [T] [ ]
      §2[ ] [F] [ ]
      §1B = порошок ифрита
      §1T = обычный факел
      §1F = Подсолнух

    spring_bell: |
      §dВесенний Колокол§7
      §7Рецепт:
      §2[A] [P] [A]
      §2[P] [B] [P]
      §2[A] [P] [A]
      §1A = осколок аметиста
      §1P = лепесток / розовый цветок
      §1B = колокол

    spring_boots: |
      §dСапоги Весеннего Шага§7
      §7Рецепт:
      §2[P] [P] [P]
      §2[P] [B] [P]
      §2[P] [P] [P]
      §1P = лепесток / розовый цветок
      §1B = сапоги

    snow_boots: |
      §6Анти-Снежные Сапоги§7
      §7Рецепт:
      §2[ ] [B] [ ]
      §2[ ] [S] [ ]
      §2[ ] [S] [ ]
      §1B = сапоги
      §1S = ведро рыхлого снега

    woodcutter_axe: |
      §6Топор Естественной Лесорубки§7
      §7Рецепт:
      §2[L] [A] [L]
      §2[O] [ ] [O]
      §2[L] [ ] [L]
      §1L = любой лист
      §1O = любое бревно
      §1A = любой топор

    frost_core: |
      §6Зимнее Ядро§7
      §7Рецепт:
      §2[S] [I] [S]
      §2[I] [B] [I]
      §2[S] [I] [S]
      §1S = Снежный блок
      §1I = Плотный лед
      §1B = Сердце моря
      §7Нажмите правой кнопкой на Снежного Голема для его улучшения.

    guardian_core: |
      §6Ядро Хранителя§7
      §7Рецепт:
      §2[I] [B] [I]
      §2[B] [G] [B]
      §2[I] [B] [I]
      §1I = Железный блок
      §1B = Железный слиток
      §1G = Осколок аметиста
      §7Нажмите правой кнопкой на Железного Голема.

    fish_trap: |
      §6Рыболовная Ловушка§7
      §7Рецепт:
      §2[S] [ ] [S]
      §2[S] [B] [S]
      §2[S] [ ] [S]
      §1S = нить
      §1B = бочка

    creature_generator: |
      §6Ловушка для Существ§7
      §7Рецепт:
      §2[S] [I] [S]
      §2[I] [T] [I]
      §2[S] [I] [S]
      §1S = нить
      §1I = железный слиток
      §1T = палка

    Clock: |
      §6Сезонные Часы§7
      §7Рецепт:
      §2[ ] [B] [ ]
      §2[ ] [R] [ ]
      §2[ ] [ ] [ ]
      §1B = Компас
      §1R = Часы


