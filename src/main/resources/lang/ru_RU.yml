guide_food:
  title: "&6Поваренная Книга Аэтэрнума"
  author: "&aСтранствующий Повар"

  page1: |
    &0&lПоваренная Книга Аэтэрнума

    &0Эта маленькая книга собрала
    &0некоторые из любимых
    &0рецептов фермеров
    &0и путешественников.

    &0Новые сезонные культуры:

    &cПомидор&0 – сочный и
    &0свежий, отлично подходит для салатов
    &0и бутербродов.

    &6Лук&0 – сильный запах,
    &0но идеален для тушеных блюд
    &0и хлеба.

    &6Рис&0 – выращивается в воде.
    &0Посадите семена в
    &0неглубоких прудах, чтобы получить
    &0рисовые стебли.

  page2: |
    &0&lОсновные блюда

    &6Салат из Помидоров&0
    &7Миска + 2x Помидор
    &0Легкий салат, который
    &0восстанавливает немного голода
    &0и дает немного
    &0регенерации.

    &6Овощной Хлеб&0
    &7Хлеб + Помидор + Лук
    &0Сытный хлеб, начиненный
    &0сезонными овощами.
    &0Дает небольшой щит из
    &0сердец поглощения.

    &6Мясной Бутерброд&0
    &7Хлеб + приготовленное мясо +
    &7Помидор + Лук
    &0Сытный бутерброд, который
    &0дает сопротивление и
    &0дополнительную силу.

  page3: |
    &0&lРис и Тушеные Блюда

    &6Посадка Риса&0
    &0Семена риса можно сажать
    &0на стоячей воде. Они растут
    &0как высокие стебли, похожие на водоросли.

    &0Разрушение стебля дает
    &0больше рисовых семян для
    &0повторной посадки.

    &6Тушеная Говядина и Рис&0
    &7Миска + приготовленное мясо +
    &7Рис
    &0Теплое рагу, которое сильно
    &0утоляет голод,
    &0восстанавливает здоровье со временем и
    &0кратковременно увеличивает насыщение.

  page4: |
    &0&lНапитки

    &6Кофе&0
    &7Бутылка + Какао + Сахар
    &0Горячий и горький. Снимает
    &0заморозку, дает скорость
    &0и ночное зрение на
    &0некоторое время.

    &6Травяной Чай&0
    &7Бутылка + лесной цветок
    &0Успокаивающий настой, который
    &0мягко лечит, помогает
    &0против холода и
    &0дает небольшой прирост здоровья.

    &6Энергетический Напиток&0
    &7Бутылка + Сахар + Редстоун
    &7+ Светокаменная пыль
    &0Очень сладкий и газированный.
    &0Дает сильную скорость и
    &0спешку на короткое время.

    &6Горячий Шоколад&0
    &7Бутылка + Какао + Молоко
    &0Идеально подходит для
    &0зимних ночей. Согревает вас,
    &0блокирует заморозку и дает
    &0сопротивление и поглощение.

  page5: |
    &6Плодородная земля&0
    Рецепт богатого удобрения:

      §2[T] [R] [R]
      §2[W] [W] [B]
      §2[B] [B] [B]

    T = Земля
    R = Гнилая плоть
    W = Пшеница
    B = Костная мука

    &7Говорят, один странствующий повар открыл способ заставить свои посевы расти намного быстрее с помощью особого удобрения.&0
    &cСледуй этому рецепту, чтобы приготовить сырой компост:&0
    &7если оставить его в воде на два дня,
    он превратится в богатую почву, идеально подходящую для выращивания урожая.&0  

