frost_guide:
  book_title: "Руководство по Замерзшему Миру"
  book_author: "Картограф Сезонов Аэтэрнума"

  page1: |
    §9Царство Вечной Стужи
    §7Вы прошли через светокаменный портал и прибыли
    в царство бесконечной зимы.
    
    §1Вы можете строить свою базу, добывать и исследовать,
    §4но помните, что враги сильнее§7.
  

  page2: |
    §9Опасности льда
    
    §7В Царстве Вечной Стужи почти у каждого врага есть
    замороженные варианты.
    
    §4Продолжайте двигаться и всегда носите
    хорошую броню и еду.

  page3: |
    §9Glacialis, Сердце Зимы
    
    §7Этот босс является причиной того, что это измерение
    заперто в вечной зиме.
    §4Glacialis появляется ночью в Царстве Вечной Стужи,
    каждые §628 дней§7.
    Его добыча особенная для брони Вечной Стужи.

  page4: |
    §6Шлем Вечной Стужи
    §7Рецепт:
    §2[S] [S] [S]
    §2[S] [C] [S]
    §2[ ] [H] [ ]
    
    §1S = Осколок Вечного Льда
    §1C = Ядро Glacialis
    §1H = Алмазный Шлем
    
    §7Шлем Вечной Стужи — это первая часть, чтобы
    встретить адский жар.

  page5: |
    §6Нагрудник Вечной Стужи
    §7Рецепт:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Осколок Вечного Льда
    §1C = Ядро Glacialis
    §1A = Алмазный Нагрудник
    
    §7Нагрудник Вечной Стужи укрепляет ваше тело.

  page6: |
    §6Поножи Вечной Стужи
    §7Рецепт:
    §2[S] [C] [S]
    §2[S] [A] [S]
    §2[S] [A] [S]
    
    §1S = Осколок Вечного Льда
    §1C = Ядро Glacialis
    §1A = Алмазные Поножи
    
    §7Они предназначены для палящей местности.

  page7: |
    §6Сапоги Вечной Стужи
    §7Рецепт:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Осколок Вечного Льда
    §1C = Ядро Glacialis
    §1A = Алмазные Сапоги
    
    §7Сапоги необходимы, чтобы
    выдержать жару.

  page8: |
    §4Следующее измерение
    §7Забытый мир, §Поглощенный Незером§7 
    который ведет в царство адского жара.
    
    §7Там враги еще сильнее, с
    увеличенным здоровьем и уроном.
    
    §7С полным комплектом Вечной Стужи
    вы будете готовы к адскому пламени.

  page9: |
    §4Царство Тлеющих Углей
    §7Строительство:
    §2[W] [W] [W] [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [W] [W] [W]
    
    §1W = Блок Адского Нароста
    §1Зажгите его огнивом

  page10: |
    §4Царство Тлеющих Углей
    Вы можете попасть в это место только в броне Вечной Стужи.
    Если вы решите войти без нее, вы сгорите заживо.

guide_heat:
  book_title: "Руководство по Выживанию в Жаре"
  book_author: "Архивы Аэтэрнума"

  page1: |
    §4§lЦАРСТВО ТЛЕЮЩИХ УГЛЕЙ
    §cВы перешли в Царство Тлеющих Углей.

    §6Здесь горит воздух, камень кровоточит огнем,
    и ничто не хочет, чтобы вы остались в живых.
    §4Это царство может быть концом вашего путешествия…
    §c…или местом, где вы возродитесь в пламени.

  page2: |
    §6§lОСНОВНОЕ ВЫЖИВАНИЕ

    §8• §cПостоянная жара §6поглотит вас
    без надлежащей защиты.
    §8• §6Никогда не приходите без §eеды§6, §eблоков §6и
    §eзелий §6готовых.
    §8• §cНе приходите в одиночку §6, если вы еще не знаете
    секретов этого царства.

  page3: |
    §3§lБРОНЯ ЗИМНЕЙ КОВКИ

    §6Только полный комплект §1Вечной Стужи §6может противостоять
    экстремальному климату.
    §cБез комплекта§6, огонь и лава
    растают вас без пощады.
    §1С ним§6, вы можете ходить сквозь пламя,
    как если бы это был твердый камень.

  page4: |
    §4§lСУЩЕСТВА ЦАРСТВА

    §8• §6Мобы здесь примерно
    §cв 4 раза сильнее.
    §8• §6У них §cбольше здоровья§6, §cбольше урона §6и почти
    все они наносят §cогненный урон§6.
    §8• §6Есть огненные варианты.
    §cЕсли вы их недооцените, вы умрете.

  page5: |
    §6§lЛУТ И РИСК

    §8• §6Руины и башни скрывают снаряжение с
    зачарованиями намного выше нормы.
    §8• §6Это лучший лут в §5Аэтэрнуме§6
    §aЕсли вы добрались до сюда, вы уже доказали свою храбрость.
    §2Теперь докажите, что вы способны
    вернуться живым.

