guide_food:
  title: "&6Livre de Cuisine d'Aeternum"
  author: "&aChef Errant"

  page1: |
    &0&lLivre de Cuisine d'Aeternum

    &0Ce petit livre rassemble
    &0quelques-unes des recettes
    &0préférées des agriculteurs
    &0et des voyageurs.

    &0Nouvelles cultures saisonnières:

    &cTomate&0 – juteuse et
    &0fraîche, idéale dans les salades
    &0et les sandwichs.

    &6Oignon&0 – forte odeur
    &0mais parfait pour les ragoûts
    &0et le pain.

    &6Riz&0 – cultivé dans l'eau.
    &0Plantez les graines dans
    &0des étangs peu profonds pour obtenir
    &0des tiges de riz.

  page2: |
    &0&lPlats de Base

    &6Salade de Tomates&0
    &7Bol + 2x Tomate
    &0Une salade légère qui
    &0restaure un peu la faim
    &0et donne un peu de
    &0régénération.

    &6Pain aux Légumes&0
    &7Pain + Tomate + Oignon
    &0Un pain rassasiant fourré
    &0de légumes de saison.
    &0Donne un petit bouclier de
    &0cœurs d'absorption.

    &6Sandwich à la Viande&0
    &7Pain + viande cuite +
    &7Tomate + Oignon
    &0Un sandwich copieux qui
    &0accorde résistance et
    &0force supplémentaire.

  page3: |
    &0&lRiz et Ragoûts

    &6Plantation de Riz&0
    &0Les graines de riz peuvent être plantées
    &0sur de l'eau stagnante. Elles poussent
    &0comme de hautes tiges, comme les algues.

    &0Casser la tige produit
    &0plus de graines de riz à planter
    &0à nouveau.

    &6Ragoût de Bœuf et Riz&0
    &7Bol + viande cuite +
    &7Riz
    &0Un ragoût chaud qui remplit
    &0beaucoup la faim, restaure
    &0la santé au fil du temps et
    &0augmente brièvement la saturation.

  page4: |
    &0&lBoissons

    &6Café&0
    &7Bouteille + Cacao + Sucre
    &0Chaud et amer. Retire
    &0le gel, donne de la vitesse
    &0et une vision nocturne pour
    &0un moment.

    &6Tisane&0
    &7Bouteille + fleur de forêt
    &0Infusion apaisante qui
    &0guérit doucement, aide
    &0contre le froid et
    &0donne un petit boost de santé.

    &6Boisson Énergétique&0
    &7Bouteille + Sucre + Redstone
    &7+ Poussière de Glowstone
    &0Très sucré et pétillant.
    &0Donne une forte vitesse et
    &0hâte pour une courte période.

    &6Chocolat Chaud&0
    &7Bouteille + Cacao + Lait
    &0Parfait pour les nuits
    &0d'hiver. Vous réchauffe,
    &0bloque le gel et donne
    &0résistance et absorption.

  page5: |
    &6Terre fertilisée&0
    Recette de l’engrais riche :

      §2[T] [R] [R]
      §2[W] [W] [B]
      §2[B] [B] [B]

    T = Terre
    R = Chair putréfiée
    W = Blé
    B = Poudre d'os

    &7On raconte qu’un cuisinier errant a découvert comment faire pousser ses cultures bien plus vite grâce à un engrais spécial.&0
    &cSuis cette recette pour préparer le compost brut :&0
    &7si tu le laisses dans l’eau pendant deux jours,
    il se transformera en une terre riche parfaite pour les cultures.&0  

