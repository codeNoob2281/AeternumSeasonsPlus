  crops:
    SPRING: "Le blé, les carottes, les pommes de terre, les betteraves et les citrouilles prospèrent; très bonne saison de culture générale."
    SUMMER: "Les pastèques, la canne à sucre, les cactus et les cultures tolérantes à la chaleur poussent le mieux."
    AUTUMN: "Citrouilles, champignons et racines; idéal pour les grandes récoltes et le stockage."
    WINTER: "Presque rien ne pousse à l'extérieur; les serres permettent de continuer la culture."

  migration:
    SPRING: "Plus de moutons, d'abeilles et de lapins dans les prairies fleuries et les forêts."
    SUMMER: "Plus de poissons tropicaux, dauphins, tortues et axolotls dans les mers chaudes."
    AUTUMN: "Renards, loups et chèvres se concentrent dans les taïgas et les zones montagneuses."
    WINTER: "Les loups et les ours polaires dominent les biomes froids; de nombreux animaux des climats chauds disparaissent."

  stables:
    winter: "Les animaux qui ne résistent pas au froid peuvent mourir s'ils n'ont pas d'étable ou d'abri."
    breeding: "La reproduction est moins efficace (ou nulle) s'ils ne sont pas dans une étable."
    bonus_drops: "Les animaux élevés ou protégés dans des étables donneront plus de butin (viande, plumes, laine, cuir)."

  weather:
    SPRING: "Pluies douces, temps tempéré et jours plus longs qui favorisent les cultures."
    SUMMER: "Soleil intense, forte chaleur et quelques orages violents."
    AUTUMN: "Vent frais, ciel nuageux et changements brusques de température."
    WINTER: "Neige fréquente, froid extrême et risque de gel si vous ne vous protégez pas."

  footer: " utilisez /seasonguide."

