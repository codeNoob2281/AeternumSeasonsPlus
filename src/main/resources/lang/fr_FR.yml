frost_guide:
  book_title: "Guide du Monde Gelé"
  book_author: "Cartographe des Saisons d'Aeternum"

  page1: |
    §9Royaume de Givre Éternel
    §7Vous avez traversé le portail de glowstone et êtes arrivé
    dans un royaume d'hiver éternel.
    
    §1Vous pouvez construire votre base, miner et explorer,
    §4mais rappelez-vous que les ennemis sont plus forts§7.
  

  page2: |
    §9Dangers de la glace
    
    §7Dans le Royaume de Givre Éternel presque tous les ennemis ont
    des variantes gelées.
    
    §4Continuez à bouger et ayez toujours
    une bonne armure et de la nourriture.

  page3: |
    §9Glacialis, Cœur de l'Hiver
    
    §7Ce boss est la raison pour laquelle cette dimension est
    piégée dans un hiver éternel.
    §4Glacialis apparaît la nuit dans le Royaume de Givre Éternel,
    tous les §628 jours§7.
    Son butin est spécial pour l'armure de Givre Éternel.

  page4: |
    §6Casque de Givre Éternel
    §7Recette:
    §2[S] [S] [S]
    §2[S] [C] [S]
    §2[ ] [H] [ ]
    
    §1S = Éclat de Glace Éternelle
    §1C = Noyau de Glacialis
    §1H = Casque en Diamant
    
    §7Le Casque de Givre Éternel est la première pièce pour
    affronter la chaleur infernale.

  page5: |
    §6Plastron de Givre Éternel
    §7Recette:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Éclat de Glace Éternelle
    §1C = Noyau de Glacialis
    §1A = Plastron en Diamant
    
    §7Le Plastron de Givre Éternel renforce votre corps.

  page6: |
    §6Jambières de Givre Éternel
    §7Recette:
    §2[S] [C] [S]
    §2[S] [A] [S]
    §2[S] [A] [S]
    
    §1S = Éclat de Glace Éternelle
    §1C = Noyau de Glacialis
    §1A = Jambières en Diamant
    
    §7Elles sont destinées aux terrains brûlants.

  page7: |
    §6Bottes de Givre Éternel
    §7Recette:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Éclat de Glace Éternelle
    §1C = Noyau de Glacialis
    §1A = Bottes en Diamant
    
    §7Les bottes sont essentielles pour
    endurer la chaleur.

  page8: |
    §4La dimension suivante
    §7Un monde oublié et §Dévoré par le Nether§7 
    qui mène à un royaume de chaleur infernale.
    
    §7Là, les ennemis sont encore plus forts, avec
    santé et dégâts multipliés.
    
    §7Avec l'ensemble complet de Givre Éternel
    vous serez prêt pour les flammes infernales.

  page9: |
    §4Royaume de Braise
    §7Construction:
    §2[W] [W] [W] [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [W] [W] [W]
    
    §1W = Bloc de Verrues du Nether
    §1Allumez-le avec un briquet

  page10: |
    §4Le Royaume de Braise
    Vous ne pouvez atteindre cet endroit qu'avec l'armure de Givre Éternel.
    Si vous décidez d'entrer sans elle, vous brûlerez à mort.

guide_heat:
  book_title: "Guide de Survie dans la Braise"
  book_author: "Archives d'Aeternum"

  page1: |
    §4§lROYAUME DE BRAISE
    §cVous avez traversé vers le Royaume de Braise.

    §6Ici l'air brûle, la pierre saigne du feu
    et rien ne veut que vous restiez en vie.
    §4Ce royaume pourrait être la fin de votre voyage…
    §c…ou l'endroit où vous renaissez dans les flammes.

  page2: |
    §6§lSURVIE DE BASE

    §8• §cLa chaleur constante §6vous consumera
    sans protection appropriée.
    §8• §6Ne venez jamais sans §anourriture§6, §ablocs §6et
    §apotions §6prêts.
    §8• §cNe venez pas seul §6si vous ne connaissez pas encore
    les secrets de ce royaume.

  page3: |
    §3§lARMURE FORGE D'HIVER

    §6Seul l'ensemble complet §1Givre Éternel §6peut résister
    au climat extrême.
    §cSans l'ensemble§6, le feu et la lave
    vous feront fondre sans pitié.
    §1Avec lui§6, vous pouvez marcher à travers les flammes
    comme si elles étaient de la pierre solide.

  page4: |
    §4§lCRÉATURES DU ROYAUME

    §8• §6Les mobs ici sont environ
    §c4 fois plus forts.
    §8• §6Ils ont §cplus de santé§6, §cplus de dégâts §6et presque
    tous infligent des §cdégâts de feu§6.
    §8• §6Il existe des variantes enflammées.
    §csi vous les sous-estimez, vous mourrez.

  page5: |
    §6§lBUTIN ET RISQUE

    §8• §6Les ruines et les tours cachent de l'équipement avec
    des enchantements bien au-dessus de la normale.
    §8• §6C'est le meilleur butin d'§5Aeternum§6
    §aSi vous êtes arrivé jusqu'ici, vous avez déjà prouvé votre courage.
    §2Maintenant, prouvez que vous êtes capable
    de revenir vivant.

