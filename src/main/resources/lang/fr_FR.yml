guide:
  # Título general (se usa tanto en chat como en el libro)
  title: "Guide des Saisons d'Aeternum"

  # Título y autor del libro escrito
  book_title: "Guide des Saisons d'Aeternum"
  book_author: "Aeternum"
  book_given: "Le guide des saisons vous a été donné."

  # Línea con la estación actual
  current: "Saison actuelle: {season}"

  # Primer párrafo del libro
  intro: "Ce guide résume la météo, les événements, les cultures et la migration des animaux pour chaque saison."

  section:
    events: "§0Événements Saisonnniers"
    crops: "§0Cultures par Saison"
    migration: "§0Migration Animale"
    stables: "Étables et Granges"
    weather: "§0Météo Typique"
    crafting: "Crafting Spécial"
    dimensions: "Dimensions"

  crafting: # <- Y AQUÍ DENTRO tus recetas
    advanced_composter: |
      §6Composteur Avancé§7
      §7Recette:
      §2[L] [H] [L]
      §2[P] [C] [P]
      §2[L] [H] [L]
      §1L = n'importe quelle feuille
      §1H = entonnoir
      §1P = citrouille
      §1C = composteur

    harvest_hoe: |
      §6Houe de la Récolte§7
      §7Recette:
      §2[W] [W] [W]
      §2[E] [H] [E]
      §2[E] [E] [E]
      §1W = blé
      §1E = émeraude
      §1H = n'importe quelle houe

    farmer_boots: |
      §6Bottes du Fermier§7
      §7Recette:
      §2[W] [B] [W]
      §2[W] [S] [W]
      §2[W] [W] [W]
      §1W = blé
      §1B = bottes
      §1S = pelle (pierre/diamant)

    lunar_lantern: |
      §6Lanterne Lunaire§7
      §7Recette:
      §2[R] [L] [R]
      §2[R] [E] [R]
      §2[R] [L] [R]
      §1R = redstone
      §1L = lanterne
      §1E = perle de l'Ender

    solar_torch: |
      §6Torche Solaire§7
      §7Recette:
      §2[B] [B] [B]
      §2[ ] [T] [ ]
      §2[ ] [F] [ ]
      §1B = poudre de blaze
      §1T = torche normale
      §1F = Tournesol

    spring_bell: |
      §dCloche du Printemps§7
      §7Recette:
      §2[A] [P] [A]
      §2[P] [B] [P]
      §2[A] [P] [A]
      §1A = éclat d'améthyste
      §1P = pétale / fleur rose
      §1B = cloche

    spring_boots: |
      §dBottes de l'Enjambée Printanière§7
      §7Recette:
      §2[P] [P] [P]
      §2[P] [B] [P]
      §2[P] [P] [P]
      §1P = pétale / fleur rose
      §1B = bottes

    snow_boots: |
      §6Bottes Anti-Neige§7
      §7Recette:
      §2[ ] [B] [ ]
      §2[ ] [S] [ ]
      §2[ ] [S] [ ]
      §1B = bottes
      §1S = seau de Neige Poudreuse

    woodcutter_axe: |
      §6Hache d'Abattage Naturelle§7
      §7Recette:
      §2[L] [A] [L]
      §2[O] [ ] [O]
      §2[L] [ ] [L]
      §1L = n'importe quelle feuille
      §1O = n'importe quelle bûche
      §1A = n'importe quelle hache

    frost_core: |
      §6Noyau Hivernal§7
      §7Recette:
      §2[S] [I] [S]
      §2[I] [B] [I]
      §2[S] [I] [S]
      §1S = Bloc de neige
      §1I = Glace compactée
      §1B = Cœur de la Mer
      §7Clic droit sur un Golem de Neige pour l'améliorer.

    guardian_core: |
      §6Noyau Gardien§7
      §7Recette:
      §2[I] [B] [I]
      §2[B] [G] [B]
      §2[I] [B] [I]
      §1I = Bloc de fer
      §1B = Lingot de fer
      §1G = Éclat d'améthyste
      §7Clic droit sur un Golem de Fer.

    fish_trap: |
      §6Piège à Poissons§7
      §7Recette:
      §2[S] [ ] [S]
      §2[S] [B] [S]
      §2[S] [ ] [S]
      §1S = ficelle
      §1B = baril

    creature_generator: |
      §6Piège à Créatures§7
      §7Recette:
      §2[S] [I] [S]
      §2[I] [T] [I]
      §2[S] [I] [S]
      §1S = ficelle
      §1I = lingot de fer
      §1T = bâton

    Clock: |
      §6Horloge Saisonnelle§7
      §7Recette:
      §2[ ] [B] [ ]
      §2[ ] [R] [ ]
      §2[ ] [ ] [ ]
      §1B = Boussole
      §1R = Horloge


