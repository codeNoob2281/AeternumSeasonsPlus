guide_food:
  title: "&6Książka Kucharska Aeternum"
  author: "&aWędrowny Kucharz"

  page1: |
    &0&lKsiążka Kucharska Aeternum

    &0Ta mała książka zbiera
    &0niektóre z ulubionych
    &0przepisów rolników
    &0i podróżników.

    &0Nowe uprawy sezonowe:

    &cPomidor&0 – soczysty i
    &0świeży, świetny w sałatkach
    &0i kanapkach.

    &6Cebula&0 – silny zapach
    &0ale idealna do gulaszu
    &0i pieczywa.

    &6Ryż&0 – uprawiany w wodzie.
    &0Zasadź nasiona w
    &0płytkich stawach, aby uzyskać
    &0łodygi ryżu.

  page2: |
    &0&lDania Podstawowe

    &6Sałatka Pomidorowa&0
    &7Miseczka + 2x Pomidor
    &0Lekka sałatka, która
    &0przywraca trochę głodu
    &0i daje trochę
    &0regeneracji.

    &6Chleb Warzywny&0
    &7Chleb + Pomidor + Cebula
    &0Syty chleb nadziewany
    &0sezonowymi warzywami.
    &0Daje małą tarczę
    &0serc absorpcji.

    &6Kanapka Mięsna&0
    &7Chleb + ugotowane mięso +
    &7Pomidor + Cebula
    &0Obfita kanapka, która
    &0daje odporność i
    &0dodatkową siłę.

  page3: |
    &0&lRyż i Gulasze

    &6Sadzenie Ryżu&0
    &0Nasiona ryżu można sadzić
    &0na stojącej wodzie. Rosną
    &0jak wysokie łodygi, podobne do wodorostów.

    &0Zniszczenie łodygi daje
    &0więcej nasion ryżu do
    &0ponownego zasadzenia.

    &6Gulasz Wołowo-Ryżowy&0
    &7Miseczka + ugotowane mięso +
    &7Ryż
    &0Ciepły gulasz, który zaspokaja
    &0duży głód, przywraca
    &0zdrowie w czasie i
    &0krótko zwiększa nasycenie.

  page4: |
    &0&lNapoje

    &6Kawa&0
    &7Butelka + Kakao + Cukier
    &0Gorąca i gorzka. Usuwa
    &0zamrożenie, daje prędkość
    &0i widzenie w nocy na
    &0jakiś czas.

    &6Herbata Ziołowa&0
    &7Butelka + leśny kwiat
    &0Uspokajający napar, który
    &0delikatnie leczy, pomaga
    &0przeciwko zimnu i
    &0daje mały wzrost zdrowia.

    &6Napój Energetyczny&0
    &7Butelka + Cukier + Redstone
    &7+ Pył Światłoniu
    &0Bardzo słodki i gazowany.
    &0Daje silną prędkość i
    &0pośpiech na krótki czas.

    &6Gorąca Czekolada&0
    &7Butelka + Kakao + Mleko
    &0Idealna na zimowe
    &0noce. Rozgrzewa cię,
    &0blokuje zamarzanie i daje
    &0odporność i absorpcję.

  page5: |
    &6Żyzna ziemia&0
    Przepis na bogaty nawóz:

      §2[T] [R] [R]
      §2[W] [W] [B]
      §2[B] [B] [B]

    T = Ziemia
    R = Zgniłe mięso
    W = Pszenica
    B = Mączka kostna

    &7Mówi się, że pewien wędrowny kucharz odkrył sposób, by jego uprawy rosły o wiele szybciej dzięki specjalnemu nawozowi.&0
    &cPostępuj według tego przepisu, aby przygotować surowy kompost:&0
    &7jeśli zostawisz go w wodzie na dwa dni,
    zamieni się w żyzną glebę idealną pod uprawy.&0  

