    advanced_composter: |
      §6Zaawansowany Kompostownik§7
      §7Przepis:
      §2[L] [H] [L]
      §2[P] [C] [P]
      §2[L] [H] [L]
      §1L = dowolny liść
      §1H = lejek
      §1P = dynia
      §1C = kompostownik

