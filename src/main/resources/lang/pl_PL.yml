frost_guide:
  book_title: "Przewodnik po Zamarzniętym Świecie"
  book_author: "Kartograf Sezonów Aeternum"

  page1: |
    §9Kraina Wiecznego Szronu
    §7Przekroczyłeś portal ze światłoniu i dotarłeś
    do krainy wiecznej zimy.
    
    §1Możesz budować swoją bazę, kopać i eksplorować,
    §4ale pamiętaj, że wrogowie są silniejsi§7.
  

  page2: |
    §9Niebezpieczeństwa lodu
    
    §7W Krainie Wiecznego Szronu prawie każdy wróg ma
    zamrożone warianty.
    
    §4Ruszaj się i zawsze noś
    dobrą zbroję i jedzenie.

  page3: |
    §9Glacialis, Serce Zimy
    
    §7Ten boss jest powodem, dla którego ten wymiar jest
    uwięziony w wiecznej zimie.
    §4Glacialis pojawia się w nocy w Krainie Wiecznego Szronu,
    co §628 dni§7.
    Jego łup jest specjalny dla zbroi Wiecznego Szronu.

  page4: |
    §6Hełm Wiecznego Szronu
    §7Przepis:
    §2[S] [S] [S]
    §2[S] [C] [S]
    §2[ ] [H] [ ]
    
    §1S = Odłamek Wiecznego Lodu
    §1C = Rdzeń Glacialis
    §1H = Diamentowy Hełm
    
    §7Hełm Wiecznego Szronu jest pierwszym elementem, by
    stawić czoła piekielnemu żarowi.

  page5: |
    §6Napierśnik Wiecznego Szronu
    §7Przepis:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Odłamek Wiecznego Lodu
    §1C = Rdzeń Glacialis
    §1A = Diamentowy Napierśnik
    
    §7Napierśnik Wiecznego Szronu wzmacnia twoje ciało.

  page6: |
    §6Nagolenniki Wiecznego Szronu
    §7Przepis:
    §2[S] [C] [S]
    §2[S] [A] [S]
    §2[S] [A] [S]
    
    §1S = Odłamek Wiecznego Lodu
    §1C = Rdzeń Glacialis
    §1A = Diamentowe Nagolenniki
    
    §7Są przeznaczone na palący teren.

  page7: |
    §6Buty Wiecznego Szronu
    §7Przepis:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Odłamek Wiecznego Lodu
    §1C = Rdzeń Glacialis
    §1A = Diamentowe Buty
    
    §7Buty są niezbędne, aby
    wytrzymać upał.

  page8: |
    §4Następny wymiar
    §7Zapomniany świat i §Pożarty przez Nether§7 
    który prowadzi do krainy piekielnego żaru.
    
    §7Tam wrogowie są jeszcze silniejsi, z
    pomnożonym zdrowiem i obrażeniami.
    
    §7Z pełnym zestawem Wiecznego Szronu
    będziesz gotowy na piekielne płomienie.

  page9: |
    §4Kraina Rozżarzona
    §7Budowa:
    §2[W] [W] [W] [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [W] [W] [W]
    
    §1W = Blok Brodawki Netheru
    §1Podpal go krzesiwem

  page10: |
    §4Kraina Rozżarzona
    Możesz dotrzeć do tego miejsca tylko w zbroi Wiecznego Szronu.
    Jeśli zdecydujesz się wejść bez niej, spłoniesz na śmierć.

guide_heat:
  book_title: "Przewodnik Przetrwania w Żarze"
  book_author: "Archiwa Aeternum"

  page1: |
    §4§lKRAINA ROŻŻARZONA
    §cPrzekroczyłeś do Krainy Rozżarzonej.

    §6Tutaj powietrze płonie, kamień krwawi ogniem
    i nic nie chce, żebyś pozostał żywy.
    §4Ta kraina może być końcem twojej podróży…
    §c…lub miejscem, gdzie odrodzisz się w płomieniach.

  page2: |
    §6§lPODSTAWOWE PRZETRWANIE

    §8• §cStały żar §6pochłonie cię
    bez odpowiedniej ochrony.
    §8• §6Nigdy nie przychodź bez §ajedzenia§6, §ablocków §6i
    §apotions §6gotowych.
    §8• §cNie przychodź sam §6jeśli jeszcze nie znasz
    sekretów tej krainy.

  page3: |
    §3§lZBROJA KUTA ZIMĄ

    §6Tylko pełny zestaw §1Wiecznego Szronu §6może wytrzymać
    ekstremalny klimat.
    §cBez zestawu§6, ogień i lawa
    roztopią cię bez litości.
    §1Z nim§6, możesz chodzić przez płomienie
    jak po solidnym kamieniu.

  page4: |
    §4§lSTWORZENIA KRAINY

    §8• §6Moby są tu w przybliżeniu
    §c4 razy silniejsze.
    §8• §6Mają §cwięcej zdrowia§6, §cwięcej obrażeń §6i prawie
    wszystkie zadają §c obrażenia od ognia§6.
    §8• §6Istnieją ogniste warianty.
    §cjeśli je zlekceważysz, umrzesz.

  page5: |
    &6&lŁUP I RYZYKO

    §8• §6Ruiny i wieże ukrywają sprzęt z
    zaklęciami znacznie powyżej normy.
    §8• §6To najlepszy łup w §5Aeternum§6
    §aJeśli dotarłeś tak daleko, już udowodniłeś swoją odwagę.
    §2Teraz udowodnij, że jesteś zdolny
    wrócić żywy.

