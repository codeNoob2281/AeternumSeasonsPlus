      §6Latarnia Księżycowa§7
      §7Przepis:
      §2[R] [L] [R]
      §2[R] [E] [R]
      §2[R] [L] [R]
      §1R = redstone
      §1L = latarnia
      §1E = perła Endu

    solar_torch: |
      §6Pochodnia Słoneczna§7
