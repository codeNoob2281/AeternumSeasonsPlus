      §2[B] [B] [B]
      §2[ ] [T] [ ]
      §2[ ] [F] [ ]
      §1B = proch blaze
      §1T = zwykła pochodnia
      §1F = Słonecznik

    spring_bell: |
      §dWiosenny Dzwon§7
      §7Przepis:
      §2[A] [P] [A]
      §2[P] [B] [P]
      §2[A] [P] [A]
      §1A = odłamek ametystu
      §1P = płatek / różowy kwiat
      §1B = dzwon

    spring_boots: |
      §dButy Wiosennego Kroku§7
      §7Przepis:
      §2[P] [P] [P]
      §2[P] [B] [P]
      §2[P] [P] [P]
      §1P = płatek / różowy kwiat
      §1B = buty

