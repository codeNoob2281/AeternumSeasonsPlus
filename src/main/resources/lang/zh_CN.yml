guide_food:
  title: "&6Aeternum烹饪书"
  author: "&a流浪厨师"

  page1: |
    &0&lAeternum烹饪书

    &0这本小册子收录了
    &0农民和旅人最爱的一些
    &0食谱。

    &0新的季节性作物：

    &c番茄&0 — 多汁新鲜，
    &0适合做沙拉和三明治。

    &6洋葱&0 — 气味浓烈，
    &0但完美用于炖菜和面包。

    &6稻米&0 — 水生作物。
    &0将种子种在浅水池中
    &0即可获得稻秆。

  page2: |
    &0&l基础菜肴

    &6番茄沙拉&0
    &7碗 + 2x番茄
    &0轻食沙拉，
    &0恢复部分饥饿值
    &0并给予少量生命恢复。

    &6蔬菜面包&0
    &7面包 + 番茄 + 洋葱
    &0塞满时令蔬菜的面包。
    &0给予少量伤害吸收护盾。

    &6肉三明治&0
    &7面包 + 熟肉 +
    &7番茄 + 洋葱
    &0扎实的三明治，
    &0给予抗性提升和
    &0额外力量。

  page3: |
    &0&l稻米与炖菜

    &6种植稻米&0
    &0稻米种子可种植在
    &0静水中，生长如海带。

    &0破坏稻秆可获得
    &0更多种子继续种植。

    &6牛肉炖饭&0
    &7碗 + 熟肉 +
    &7稻米
    &0温暖的炖菜，大幅
    &0恢复饥饿值，持续恢复
    &0生命值并短暂提升饱食度。

  page4: |
    &0&l饮品

    &6咖啡&0
    &7瓶子 + 可可豆 + 糖
    &0热而苦涩。解除
    &0冻结，给予速度和
    &0夜视效果一段时间。

    &6草本茶&0
    &7瓶子 + 森林花卉
    &0舒缓浸剂，温和治疗，
    &0帮助抵御寒冷并给予
    &0少量生命提升。

    &6能量饮料&0
    &7瓶子 + 糖 + 红石粉
    &7+ 荧石粉
    &0非常甜且起泡。给予
    &0强效速度和急迫效果，
    &0持续时间较短。

    &6热巧克力&0
    &7瓶子 + 可可豆 + 牛奶
    &0寒冬之夜的完美选择。
    &0温暖身体，阻止冻结，
    &0给予抗性和伤害吸收。

  page5: |-
    &6沃土&0
    优质肥料配方：

      §2[T] [R] [R]
      §2[W] [W] [B]
      §2[B] [B] [B]

    T = 泥土
    R = 腐肉
    W = 小麦
    B = 骨粉

    &7传说一位流浪厨师发现了特殊肥料让作物长得更快。&0
    &c按此配方准备生堆肥：&0
    &7在水中浸泡两天后，
    会变为肥沃土壤，完美用于耕作。&0   

