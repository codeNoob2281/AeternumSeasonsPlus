frost_guide:
  book_title: "冰封世界指南"
  book_author: "Aeternum季节制图师"

  page1: |
    §9永霜领域
    §7你穿过萤石传送门，
    来到无尽寒冬的国度。
    
    §1你可以建造基地、采矿和探索，
    §4但记住敌人更强§7。

  page2: |
    §9冰之危险
    
    §7在永霜领域，几乎所有敌人
    都有冰霜变种。
    
    §4保持移动，始终携带
    优质护甲和食物。

  page3: |
    §9Glacialis，寒冬之心
    
    §7这位Boss是此维度
    永陷寒冬的原因。
    §4Glacialis每§628天&7在永霜领域的夜晚出现。
    他的战利品对永霜护甲至关重要。

  page4: |
    §6永霜头盔
    §7合成配方：
    §2[S] [S] [S]
    §2[S] [C] [S]
    §2[ ] [H] [ ]
    
    §1S = 永霜碎片
    §1C = Glacialis核心
    §1H = 钻石头盔
    
    §7永霜头盔是面对
    地狱之热的第一件装备。

  page5: |
    §6永霜胸甲
    §7合成配方：
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = 永霜碎片
    §1C = Glacialis核心
    §1A = 钻石胸甲
    
    §7永霜胸甲强化你的身体。

  page6: |
    §6永霜护腿
    §7合成配方：
    §2[S] [C] [S]
    §2[S] [A] [S]
    §2[S] [A] [S]
    
    §1S = 永霜碎片
    §1C = Glacialis核心
    §1A = 钻石护腿
    
    §7专为灼热地形设计。

  page7: |
    §6永霜靴子
    §7合成配方：
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = 永霜碎片
    §1C = Glacialis核心
    §1A = 钻石靴子
    
    §7靴子对抵御
    酷热至关重要。

  page8: |
    §4下一个维度
    §7被遗忘的世界，§D被下界吞噬§7
    通向地狱之热的领域。
    
    §7那里的敌人更强，
    生命和伤害成倍增加。
    
    §7穿上全套永霜装备
    你将准备好面对地狱烈焰。

  page9: |
    §4余烬领域
    §7建造方法：
    §2[W] [W] [W] [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [W] [W] [W]
    
    §1W = 下界疣块
    §1用打火石点燃

  page10: |
    §4余烬领域
    只有永霜护甲才能抵达此地。
    若无护甲进入，你会被烧死。

guide_heat:
  book_title: "余烬领域生存指南"
  book_author: "Aeternum档案"

  page1: |
    §4§l余烬领域
    §c你已踏入余烬领域。

    §6这里空气燃烧，石头流血，
    万物都不希望你活着。
    §4这里可能是你旅程的终点…
    §c…或是你在火焰中重生的地方。

  page2: |
    §6§l基础生存

    §8• §c持续的高温§6会吞噬你，
    没有适当防护。
    §8• §6永远备好§a食物&6、&a方块&6和
    §a药水&6。
    §8• §c不要独自前来&6，如果你还不了解
    这个领域的秘密。

  page3: |
    §3§l冬锻护甲

    §6只有全套§1永霜&6套装才能
    承受极端气候。
    §c没有这套装备&6，火焰和岩浆
    会无情地融化你。
    §1穿上它&6，你就能穿过火焰
    如同踏过坚实的石头。

  page4: |
    §4§l领域生物

    §8• §6这里的怪物大约
    &c强4倍。
    §8• §6它们有&c更多生命&6、&c更高伤害&6且几乎
    都造成&c火焰伤害&6。
    §8• §6存在烈焰变种。
    &c低估它们，就会死亡。

  page5: |
    §6§l战利品与风险

    §8• §6废墟和塔楼中藏着
    远超常规的附魔装备。
    §8• §6这是§5Aeternum&6中最好的战利品
    &a能走到这里，你已证明了自己的勇气。
    &2现在证明你能
    活着回来。

