guide_food:
  title: "&6永恆食譜"
  author: "&a流浪廚師"

  page1: |
    &0&l永恆食譜

    &0這本小書收集了一些
    &0農夫和旅行者最愛的
    &0食譜。

    &0新季節作物:

    &c番茄&0 – 多汁新鮮，
    &0非常適合沙拉
    &0和三明治。

    &6洋蔥&0 – 氣味濃烈，
    &0但非常適合燉菜
    &0和麵包。

    &6稻米&0 – 在水中
    &0種植。將種子
    &0種植在淺水池中。

  page2: |
    &0&l基礎菜餚

    &6番茄沙拉&0
    &7碗 + 2x 番茄
    &0清淡沙拉，恢復少量
    &0飢餓值並在幾秒內
    &0給予生命恢復。

    &6蔬菜麵包&0
    &7麵包 + 番茄 + 洋蔥
    &0非常飽腹的麵包，塞滿了
    &0時令蔬菜。給予一個小小的
    &0吸收心護盾。

    &6肉三明治&0
    &7麵包 + 熟肉 +
    &7番茄 + 洋蔥
    &0扎實的三明治，
    &0給予抗性提升和
    &0額外力量。

  page3: |
    &0&l稻米與燉菜

    &6種植稻米&0
    &0稻米種子可種植在
    &0靜水中，生長如海帶。

    &0破壞稻稈可獲得
    &0更多種子繼續種植。

    &6牛肉燉飯&0
    &7碗 + 熟肉 +
    &7稻米
    &0溫暖的燉菜，大幅
    &0恢復飢餓值，持續恢復
    &0生命值並短暫提升飽食度。

  page4: |
    &0&l飲品

    &6咖啡&0
    &7瓶子 + 可可豆 + 糖
    &0熱而苦澀。解除
    &0凍結，給予速度和
    &0夜視效果一段時間。

    &6草本茶&0
    &7瓶子 + 森林花卉
    &0舒緩浸劑，溫和治療，
    &0幫助抵禦寒冷並給予
    &0少量生命提升。

    &6能量飲料&0
    &7瓶子 + 糖 + 紅石粉
    &7+ 螢石粉
    &0非常甜，有氣，充滿糖分。
    &0在幾秒內給予大量速度和
    &0挖掘效率。

    &6熱巧克力&0
    &7瓶子 + 可可豆 + 牛奶
    &0理想的冬夜飲品。保暖，
    &0避免凍結，並給予抗性和
    &0吸收心。

  page5: |
    &6肥沃土壤&0
    富饒肥料配方:

      §2[T] [R] [R]
      §2[W] [W] [B]
      §2[B] [B] [B]

    T = 泥土
    R = 殭屍肉
    W = 小麥
    B = 骨粉

    &7他們說一位流浪廚師發現了如何通過一種特殊肥料讓他的作物生長得更快。&0
    &c遵循這個配方來準備生堆肥:&0
    &7如果你把它放在水邊兩天，
    它就會變成適合種植的富饒土壤。&0.

