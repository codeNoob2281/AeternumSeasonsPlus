frost_guide:
  book_title: "冰封領域指南"
  book_author: "永恆季節製圖師"

  page1: |
    §9冰封領域
    §7你穿過螢石傳送門，來到一個
    永恆寒冬的世界。

    §1你可以建立你的基地、採礦和探索，
    §4但請記住敵人會更強大§7。


  page2: |
    §9冰雪的危險
    
    §7在冰封領域，幾乎所有敵人都有
    寒冷變種。

    §4保持移動，隨時攜帶
    好的盔甲和食物

  page3: |
    §9冰川之核, 寒冬之心
    
    §7這個頭目是導致這個維度
    陷入永恆寒冬的原因。
    §4冰川之核每 §628 天 §7晚上會在冰封領域出現。
    它的戰利品對於製作寒冷盔甲很特別

  page4: |
    §6寒霜頭盔
    §7配方:
    §2[S] [S] [S]
    §2[S] [C] [S]
    §2[ ] [H] [ ]

    §1S = 永恆寒冰碎片
    §1C = 冰川之核
    §1H = 鑽石頭盔

    §7寒霜頭盔是第一件抵禦
    酷熱的盔甲。

  page5: |
    §6寒霜胸甲
    §7配方:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]

    §1S = 永恆寒冰碎片
    §1C = 冰川之核
    §1A = 鑽石胸甲

    §7寒霜胸甲強化你的身體。

  page6: |
    §6寒霜護腿
    §7配方:
    §2[S] [C] [S]
    §2[S] [A] [S]
    §2[S] [A] [S]

    §1S = 永恆寒冰碎片
    §1C = 冰川之核
    §1A = 鑽石護腿

    §7它們適用於炎熱地形。

  page7: |
    §6寒霜靴子
    §7配方:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]

    §1S = 永恆寒冰碎片
    §1C = 冰川之核
    §1A = 鑽石靴子

    §7靴子是抵禦
    炎熱所必需的。

  page8: |
    §4下一個維度
    §7一個被遺忘的，被 §c下界吞噬§7 的世界，
    通往一個酷熱的領域。

    §7在那裡敵人會更強大，生命值和傷害都會成倍增加。

    §7穿上整套盔甲
    你將為地獄般的火焰做好準備。

  page9: |
    §4餘燼領域
    §7建造:
    §2[W] [W] [W] [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [W] [W] [W]
    
    §1W = 下界疣塊
    §1用打火石點燃它

  page10: |
    §4餘燼領域
    只有穿著寒霜盔甲才能進入這個地方。
    如果你沒有穿，你會被燒死。

guide_heat:
  book_title: "餘燼領域指南"
  book_author: "永恆檔案"

  page1: |
    §4§l餘燼領域
    §c你已經進入餘燼領域。

    §6這裡的空氣灼熱，石頭流淌著火焰，
    一切都不想讓你活著離開。
    §4這個領域可能是你旅程的終點...
    §c...或者你是浴火重生的戰士。

  page2: |
    §6§l基礎生存

    §8• §c持續的高溫 §6會在沒有適當保護的情況下
    §6消耗你。
    §8• §6永遠不要沒有 §a食物§6、 §a方塊 §6和
    §2 藥水 §6就來。
    §8• §c不要單獨前來。

  page3: |
    §3§l寒霜盔甲

    §6只有 §6整套盔甲 §6才能
    抵抗極端天氣。

    §c沒有盔甲§6，火焰和岩漿
    會毫不留情地熔化你。
    §4有了它§6，你就可以在火焰中行走，
    就好像它們是普通的石頭一樣。

  page4: |
    §4§l領域生物

    §8• §6這裡的怪物大約
    §c強大 4 倍。
    §8• §6它們有 §c更多生命值§6、 §c更多傷害 §6，幾乎所有
    都會造成 §c火焰傷害§6。
    §8• §6存在火焰變種
    §c如果你低估了它們，你會死。

  page5: |
    §6§l戰利品與風險

    §8• §6廢墟和高塔隱藏著附魔
    遠超尋常的裝備。
    §8• §6這是 §5永恆§6 中最好的戰利品
    §a如果你已經到達這裡，你已經證明了你的勇氣。
    §2現在證明你有能力
    活著回來。

