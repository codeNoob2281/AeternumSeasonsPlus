frost_guide:
  book_title: "Guía del Mundo Gélido"
  book_author: "Cartógrafo de Aeternum Seasons"

  page1: |
    §9Mundo Gélido
    §7Has cruzado el portal de glowstone y has llegado
    al un mundo del invierno infinito.

    §1Puedes establecer tu base, minar y explorar,
    §4pero recuerda los enemigos son màs fuertes§7.


  page2: |
    §9Peligros del hielo
    
    §7En el Mundo Gélido casi todos los enemigos tienen
    variantes heladas.

    §4Mantente en movimiento y lleva siempre una
    buena armadura y comida

  page3: |
    §9Glacialis, Corazón del Invierno
    
    §7Este jefe es la causa de que esta dimensión este
    atrapada en un invierno eterno.
    §4Glacialis aparece de noche en el Mundo Gélido,
    cada §628 días§7.
    Su loot es espacial para la armadura gélida

  page4: |
    §6Casco Gélido
    §7Receta:
    §2[S] [S] [S]
    §2[S] [C] [S]
    §2[ ] [H] [ ]

    §1S = Fragmento de Hielo Eterno
    §1C = Núcleo de Glacialis
    §1H = Casco de Diamante

    §7El casco Gélido es la primera pieza para
    al calor infernal.

  page5: |
    §6Pechera Gélida
    §7Receta:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]

    §1S = Fragmento de Hielo Eterno
    §1C = Núcleo de Glacialis
    §1A = Pechera de Diamante

    §7La pechera Gélido refuerza tu cuerpo.

  page6: |
    §6Grebas Gélido
    §7Receta:
    §2[S] [C] [S]
    §2[S] [A] [S]
    §2[S] [A] [S]

    §1S = Fragmento de Hielo Eterno
    §1C = Núcleo de Glacialis
    §1A = Pantalones de Diamante

    §7Son para terrenos calientes.

  page7: |
    §6Botas Gélido
    §7Receta:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]

    §1S = Fragmento de Hielo Eterno
    §1C = Núcleo de Glacialis
    §1A = Botas de Diamante

    §7Las botas son necesarias para
    el calor.

  page8: |
    §4La próxima dimensión
    §7Un mundo olvidado y §Consumido por el Nether§7 
    que lleva a un reino de calor infernal.

    §7Allí los enemigos son aún más fuertes, con
    vida y daño multiplicados.

    §7Con el set completo
    estarán preparados para el fuego infernal.

  page9: |
    §4Mundo Infernal
    §7Construcción:
    §2[W] [W] [W] [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [W] [W] [W]
    
    §1W = Bloque de verruga
    §1Enciéndelo con un mechero

  page10: |
    §4El Mundo infernal
    Solo se puede acceder a este lugar con la armadura gélida.
    Si decides entrar, sin ella morirás quemado.

guide_heat:
  book_title: "Guía del Mundo Infernal"
  book_author: "Archivos de Aeternum"

  page1: |
    §4§lMUNDO INFERNAL
    §cHas cruzado al Mundo Infernal.

    §6Aquí el aire quema, la piedra sangra fuego
    y nada quiere que sigas con vida.
    §4Este reino puede ser el final de tu viaje…
    §c…o el lugar donde renaces entre las llamas.

  page2: |
    §6§lSUPERVIVENCIA BÁSICA

    §8• §cEl calor constante §6te consumirá sin
    la protección adecuada.
    §8• §6Nunca vengas sin §a comida§6, §a bloques §6y
    §2 pociones §6preparadas.
    §8• §cNo vengas solo.

  page3: |
    §3§lARMADURA GÉLIDA

    §6Solo el set §6completo puede
    resistir el clima extremo.

    §cSin el set§6, el fuego y la lava
    te derretirán sin piedad.
    §4Con él§6, podrás caminar entre las llamas
    como si fueran simple piedra.

  page4: |
    §4§lCRIATURAS DEL REINO

    §8• §6Los mobs aquí son aproximadamente
    §c4 veces más fuertes.
    §8• §6Tienen §cmás vida§6, §cmás daño §6y casi todos
    aplican §cdaño de fuego§6.
    §8• §6Existen variantes ígneas
    §csi las subestimas, mueres.

  page5: |
    §6§lBOTÍN Y RIESGO

    §8• §6Las ruinas y torres ocultan equipo con
    encantamientos muy por encima de lo normal.
    §8• §6Es el mejor botín de §5Aeternum§6
    §aSi has llegado hasta aquí, ya demostraste valor.
    §2Ahora demuestra que eres capaz
    de regresar con vida.

