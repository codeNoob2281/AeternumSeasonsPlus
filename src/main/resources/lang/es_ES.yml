guide_food:
  title: "&6Recetario de Aeternum"
  author: "&aCocinero Errante"

  page1: |
    &0&lRecetario de Aeternum

    &0Este pequeño libro reúne
    &0algunas de las recetas
    &0favoritas de granjeros
    &0y viajeros.

    &0Nuevos cultivos de temporada:

    &cTomate&0 – jugoso y fresco,
    &0perfecto para ensaladas
    &0y bocadillos.

    &6Cebolla&0 – olor fuerte,
    &0pero ideal para guisos
    &0y panes.

    &6Arroz&0 – se cultiva en
    &0el agua. Planta las
    &0semillas en charcas
    &0pocas profundas.

  page2: |
    &0&lPlatos básicos

    &6Ensalada de Tomate&0
    &7Cuenco + 2x Tomate
    &0Ensalada ligera que
    &0recupera algo de hambre
    &0y otorga regeneración
    &0por unos segundos.

    &6Pan de Verduras&0
    &7Pan + Tomate + Cebolla
    &0Pan muy saciante relleno
    &0con verduras de temporada.
    &0Da un pequeño escudo de
    &0corazones de absorción.

    &6Sándwich de Carne&0
    &7Pan + carne cocinada +
    &7Tomate + Cebolla
    &0Bocadillo contundente que
    &0da resistencia y algo de
    &0fuerza durante un rato.

  page3: |
    &0&lArroz y guisos

    &6Cultivo de Arroz&0
    &0Las semillas de arroz se
    &0plantan sobre agua quieta.
    &0Crecen como tallos altos,
    &0parecidos al alga.

    &0Al romper el tallo obtendrás
    &0más semillas para volver
    &0a plantar.

    &6Guiso de Carne con Arroz&0
    &7Cuenco + carne cocinada +
    &7Arroz
    &0Guiso caliente que llena
    &0mucha hambre, cura poco
    &0a poco y mejora la
    &0saturación durante un
    &0breve tiempo.

  page4: |
    &0&lBebidas

    &6Café&0
    &7Botella + Cacao + Azúcar
    &0Caliente y amargo.
    &0Quita el congelamiento,
    &0da velocidad y visión
    &0nocturna un rato.

    &6Té de Hierbas&0
    &7Botella + flor del bosque
    &0Infusión calmante que
    &0cura suavemente, ayuda
    &0contra el frío y otorga
    &0un pequeño aumento de
    &0vida máxima.

    &6Bebida Energética&0
    &7Botella + Azúcar + Redstone
    &7+ Polvo de Glowstone
    &0Muy dulce y con gas.
    &0Da mucha velocidad y
    &0prisa minera durante
    &0unos segundos.

    &6Chocolate Caliente&0
    &7Botella + Cacao + Leche
    &0Ideal para noches de
    &0invierno. Calienta,
    &0evita el congelamiento y
    &0otorga resistencia y
    &0corazones de absorción.

  page5: |
    &6Tierra abonada&0
    Receta del abono rico:

      §2[T] [R] [R]
      §2[W] [W] [B]
      §2[B] [B] [B]

    T = Tierra
    R = Carne de zombie
    W = Trigo
    B = Hueso molido

    &7Cuentan que un cocinero errante descubrió cómo hacer que sus cultivos crezcan mucho más rápido gracias a un abono especial.&0
    &cSigue esta receta para preparar la composta cruda:&0
    &7si la dejas reposar sobre el agua durante dos días,
    se transformará en una tierra rica perfecta para el cultivo.&0.  

