guide:
  # Título general (se usa tanto en chat como en el libro)
  title: "Guía de Aeternum Seasons"

  # Título y autor del libro escrito
  book_title: "Guía de Aeternum Seasons"
  book_author: "Aeternum"
  book_given: "Se te ha entregado la guía de estaciones."

  # Línea con la estación actual
  current: "Estación actual: {season}"

  # Primer párrafo del libro
  intro: "Esta guía resume el clima, los eventos, los cultivos y la migración de animales para cada estación."

  section:
    events: "§0Eventos estacionales"
    crops: "§0Cultivos por estación"
    migration: "§0Migración animal"
    stables: "Establos y graneros"
    weather: "§0Clima típico"
    crafting: "Crafteos especiales"
    dimensions: "Dimensiones"

  crafting: # <- Y AQUÍ DENTRO tus recetas
    advanced_composter: |
      §6Compostador Avanzado§7
      §7Receta:
      §2[L] [H] [L]
      §2[P] [C] [P]
      §2[L] [H] [L]
      §1L = cualquier hoja   
      §1H = tolva
      §1P = calabaza 
      §1C = compostador

    harvest_hoe: |
      §6Azada de la Cosecha§7
      §7Receta:
      §2[W] [W] [W]
      §2[E] [H] [E]
      §2[E] [E] [E]
      §1W = trigo     
      §1E = esmeralda
      §1H = cualquier azada

    farmer_boots: |
      §6Botas del Labrador§7
      §7Receta:
      §2[W] [B] [W]
      §2[W] [S] [W]
      §2[W] [W] [W]
      §1W = trigo     
      §1B = botas
      §1S = pala (piedra/diamante)

    lunar_lantern: |
      §6Linterna Lunar§7
      §7Receta:
      §2[R] [L] [R]
      §2[R] [E] [R]
      §2[R] [L] [R]
      §1R = redstone  
      §1L = linterna
      §1E = perla de Ender

    solar_torch: |
      §6Antorcha Solar§7
      §7Receta:
      §2[B] [B] [B]
      §2[ ] [T] [ ]
      §2[ ] [F] [ ]
      §1B = polvo de blaze
      §1T = antorcha normal
      §1F = Girasol

    spring_bell: |
      §dCampana de Primavera§7
      §7Receta:
      §2[A] [P] [A]
      §2[P] [B] [P]
      §2[A] [P] [A]
      §1A = fragmento de amatista
      §1P = pétalo / flor rosa
      §1B = campana

    spring_boots: |
      §dZancada Primaveral§7
      §7Receta:
      §2[P] [P] [P]
      §2[P] [B] [P]
      §2[P] [P] [P]
      §1P = pétalo / flor rosa
      §1B = botas

    snow_boots: |
      §6Botas Antinieve§7
      §7Receta:
      §2[ ] [B] [ ]
      §2[ ] [S] [ ]
      §2[ ] [S] [ ]
      §1B = botas
      §1S = cubo de Nieve en Polvo

    woodcutter_axe: |
      §6Hacha de Tala Natural§7
      §7Receta:
      §2[L] [A] [L]
      §2[O] [ ] [O]
      §2[L] [ ] [L]
      §1L = cualquier hoja    
      §1O = cualquier tronco
      §1A = cualquier hacha

    frost_core: |
      §6Núcleo Invernal§7
      §7Receta:
      §2[S] [I] [S]
      §2[I] [B] [I]
      §2[S] [I] [S]
      §1S = Bloque de nieve
      §1I = Hielo comprimido
      §1B = Corazón del mar
      §7Clic derecho sobre un Gólem de Nieve para mejorarlo.

    guardian_core: |
      §6Núcleo Guardián§7
      §7Receta:
      §2[I] [B] [I]
      §2[B] [G] [B]
      §2[I] [B] [I]
      §1I = Bloque de hierro
      §1B = Lingote de hierro
      §1G = Fragmento de amatista
      §7Clic derecho sobre un Gólem de Hierro.

    fish_trap: |
      §6Trampa de Pesca§7
      §7Receta:
      §2[S] [ ] [S]
      §2[S] [B] [S]
      §2[S] [ ] [S]
      §1S = cuerda
      §1B = barril

    creature_generator: |
      §6Trampa de Criaturas§7
      §7Receta:
      §2[S] [I] [S]
      §2[I] [T] [I]
      §2[S] [I] [S]
      §1S = cuerda
      §1I = lingote de hierro
      §1T = palo

    Clock: |
      §6Reloj Estacional§7
      §7Receta:
      §2[ ] [B] [ ]
      §2[ ] [R] [ ]
      §2[ ] [ ] [ ]
      §1B = Brujula
      §1R = Reloj  
  

