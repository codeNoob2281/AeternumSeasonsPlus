guide_food:
  title: "&6Ricettario di Aeternum"
  author: "&aChef Errante"

  page1: |
    &0&lRicettario di Aeternum

    &0Questo piccolo libro raccoglie
    &0alcune delle ricette preferite
    &0dai contadini
    &0e dai viaggiatori.

    &0Nuovi raccolti stagionali:

    &cPomodoro&0 – succoso e
    &0fresco, ottimo in insalate
    &0e panini.

    &6Cipolla&0 – odore forte
    &0ma perfetta per stufati
    &0e pane.

    &6Riso&0 – coltivato in acqua.
    &0Pianta i semi in
    &0stagni poco profondi per ottenere
    &0steli di riso.

  page2: |
    &0&lPiatti Base

    &6Insalata di Pomodoro&0
    &7Ciotola + 2x Pomodoro
    &0Un'insalata leggera che
    &0ripristina un po' di fame
    &0e dà un po' di
    &0rigenerazione.

    &6Pane alle Verdure&0
    &7Pane + Pomodoro + Cipolla
    &0Un pane saziante ripieno
    &0di verdure di stagione.
    &0Dà un piccolo scudo di
    &0cuori assorbimento.

    &6Panino con Carne&0
    &7Pane + carne cotta +
    &7Pomodoro + Cipolla
    &0Un panino sostanzioso che
    &0concede resistenza e
    &0forza extra.

  page3: |
    &0&lRiso e Stufati

    &6Piantagione di Riso&0
    &0I semi di riso possono essere piantati
    &0su acqua ferma. Crescono
    &0come steli alti, come le alghe marine.

    &0Rompere lo stelo produce
    &0più semi di riso da piantare
    &0di nuovo.

    &6Stufato di Manzo e Riso&0
    &7Ciotola + carne cotta +
    &7Riso
    &0Uno stufato caldo che riempie
    &0molta fame, ripristina
    &0la salute nel tempo e
    &0aumenta brevemente la saturazione.

  page4: |
    &0&lBevande

    &6Caffè&0
    &7Bottiglia + Cacao + Zucchero
    &0Caldo e amaro. Rimuove
    &0il congelamento, dà velocità
    &0e visione notturna per
    &0un po'.

    &6Tè alle Erbe&0
    &7Bottiglia + fiore della foresta
    &0Infuso calmante che
    &0cura delicatamente, aiuta
    &0contro il freddo e
    &0dà un piccolo aumento di salute.

    &6Bevanda Energetica&0
    &7Bottiglia + Zucchero + Redstone
    &7+ Polvere di Glowstone
    &0Molto dolce e frizzante.
    &0Concede forte velocità e
    &0fretta per un breve periodo.

    &6Cioccolata Calda&0
    &7Bottiglia + Cacao + Latte
    &0Perfetta per le notti
    &0invernali. Ti riscalda,
    &0blocca il congelamento e dà
    &0resistenza e assorbimento.

  page5: |
    &6Terra fertilizzata&0
    Ricetta del fertilizzante ricco:

      §2[T] [R] [R]
      §2[W] [W] [B]
      §2[B] [B] [B]

    T = Terra
    R = Carne marcia
    W = Grano
    B = Farina d'ossa

    &7Si racconta che un cuoco errante abbia scoperto come far crescere i suoi raccolti molto più in fretta grazie a un fertilizzante speciale.&0
    &cSegui questa ricetta per preparare il compost grezzo:&0
    &7se lo lasci in acqua per due giorni,
    si trasformerà in una terra ricca perfetta per le coltivazioni.&7 

