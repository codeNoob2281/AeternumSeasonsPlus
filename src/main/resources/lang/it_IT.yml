guide:
  # Título general (se usa tanto en chat como en el libro)
  title: "Guida alle Stagioni di Aeternum"

  # Título y autor del libro escrito
  book_title: "Guida alle Stagioni di Aeternum"
  book_author: "Aeternum"
  book_given: "Ti è stata consegnata la guida delle stagioni."

  # Línea con la estación actual
  current: "Stagione attuale: {season}"

  # Primer párrafo del libro
  intro: "Questa guida riassume il clima, gli eventi, le colture e la migrazione degli animali per ogni stagione."

  section:
    events: "§0Eventi Stagionali"
    crops: "§0Colture per Stagione"
    migration: "§0Migrazione Animale"
    stables: "Stalle e Granai"
    weather: "§0Clima Tipico"
    crafting: "Crafting Speciale"
    dimensions: "Dimensioni"

  crafting: # <- Y AQUÍ DENTRO tus recetas
    advanced_composter: |
      §6Compostatore Avanzato§7
      §7Ricetta:
      §2[L] [H] [L]
      §2[P] [C] [P]
      §2[L] [H] [L]
      §1L = qualsiasi foglia
      §1H = tramoggia
      §1P = zucca
      §1C = compostatore

    harvest_hoe: |
      §6Zappa del Raccolto§7
      §7Ricetta:
      §2[W] [W] [W]
      §2[E] [H] [E]
      §2[E] [E] [E]
      §1W = grano
      §1E = smeraldo
      §1H = qualsiasi zappa

    farmer_boots: |
      §6Stivali del Contadino§7
      §7Ricetta:
      §2[W] [B] [W]
      §2[W] [S] [W]
      §2[W] [W] [W]
      §1W = grano
      §1B = stivali
      §1S = pala (pietra/diamante)

    lunar_lantern: |
      §6Lanterna Lunare§7
      §7Ricetta:
      §2[R] [L] [R]
      §2[R] [E] [R]
      §2[R] [L] [R]
      §1R = redstone
      §1L = lanterna
      §1E = perla di Ender

    solar_torch: |
      §6Torcia Solare§7
      §7Ricetta:
      §2[B] [B] [B]
      §2[ ] [T] [ ]
      §2[ ] [F] [ ]
      §1B = polvere di blaze
      §1T = torcia normale
      §1F = Girasole

    spring_bell: |
      §dCampana di Primavera§7
      §7Ricetta:
      §2[A] [P] [A]
      §2[P] [B] [P]
      §2[A] [P] [A]
      §1A = scheggia di ametista
      §1P = petalo / fiore rosa
      §1B = campana

    spring_boots: |
      §dStivali della Falcata Primaverile§7
      §7Ricetta:
      §2[P] [P] [P]
      §2[P] [B] [P]
      §2[P] [P] [P]
      §1P = petalo / fiore rosa
      §1B = stivali

    snow_boots: |
      §6Stivali Anti-Neve§7
      §7Ricetta:
      §2[ ] [B] [ ]
      §2[ ] [S] [ ]
      §2[ ] [S] [ ]
      §1B = stivali
      §1S = secchio di Neve in Polvere

    woodcutter_axe: |
      §6Ascia da Taglialegna Naturale§7
      §7Ricetta:
      §2[L] [A] [L]
      §2[O] [ ] [O]
      §2[L] [ ] [L]
      §1L = qualsiasi foglia
      §1O = qualsiasi tronco
      §1A = qualsiasi ascia

    frost_core: |
      §6Nucleo Invernale§7
      §7Ricetta:
      §2[S] [I] [S]
      §2[I] [B] [I]
      §2[S] [I] [S]
      §1S = Blocco di neve
      §1I = Ghiaccio compattato
      §1B = Cuore del mare
      §7Clic destro su un Golem di Neve per migliorarlo.

    guardian_core: |
      §6Nucleo Guardiano§7
      §7Ricetta:
      §2[I] [B] [I]
      §2[B] [G] [B]
      §2[I] [B] [I]
      §1I = Blocco di ferro
      §1B = Lingotto di ferro
      §1G = Scheggia di ametista
      §7Clic destro su un Golem di Ferro.

    fish_trap: |
      §6Trappola da Pesca§7
      §7Ricetta:
      §2[S] [ ] [S]
      §2[S] [B] [S]
      §2[S] [ ] [S]
      §1S = corda
      §1B = barile

    creature_generator: |
      §6Trappola per Creature§7
      §7Ricetta:
      §2[S] [I] [S]
      §2[I] [T] [I]
      §2[S] [I] [S]
      §1S = corda
      §1I = lingotto di ferro
      §1T = bastone

    Clock: |
      §6Orologio Stagionale§7
      §7Ricetta:
      §2[ ] [B] [ ]
      §2[ ] [R] [ ]
      §2[ ] [ ] [ ]
      §1B = Bussola
      §1R = Orologio


