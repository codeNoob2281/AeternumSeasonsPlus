frost_guide:
  book_title: "Guida del Mondo Ghiacciato"
  book_author: "Cartografo delle Stagioni di Aeternum"

  page1: |
    §9Reame di Ghiaccio Eterno
    §7Hai attraversato il portale di glowstone e sei arrivato
    in un reame di eterno inverno.
    
    §1Puoi costruire la tua base, estrarre e esplorare,
    §4ma ricorda che i nemici sono più forti§7.
  

  page2: |
    §9Pericoli del ghiaccio
    
    §7Nel Reame di Ghiaccio Eterno quasi ogni nemico ha
    varianti ghiacciate.
    
    §4Continua a muoverti e porta sempre
    una buona armatura e cibo.

  page3: |
    §9Glacialis, Cuore dell'Inverno
    
    §7Questo boss è la ragione per cui questa dimensione è
    intrappolata in un inverno eterno.
    §4Glacialis appare di notte nel Reame di Ghiaccio Eterno,
    ogni §628 giorni§7.
    Il suo bottino è speciale per l'armatura di Ghiaccio Eterno.

  page4: |
    §6Elmo di Ghiaccio Eterno
    §7Ricetta:
    §2[S] [S] [S]
    §2[S] [C] [S]
    §2[ ] [H] [ ]
    
    §1S = Scheggia di Ghiaccio Eterno
    §1C = Nucleo di Glacialis
    §1H = Elmo di Diamante
    
    §7L'Elmo di Ghiaccio Eterno è il primo pezzo per
    affrontare il calore infernale.

  page5: |
    §6Corazza di Ghiaccio Eterno
    §7Ricetta:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Scheggia di Ghiaccio Eterno
    §1C = Nucleo di Glacialis
    §1A = Corazza di Diamante
    
    §7La Corazza di Ghiaccio Eterno rinforza il tuo corpo.

  page6: |
    §6Gambali di Ghiaccio Eterno
    §7Ricetta:
    §2[S] [C] [S]
    §2[S] [A] [S]
    §2[S] [A] [S]
    
    §1S = Scheggia di Ghiaccio Eterno
    §1C = Nucleo di Glacialis
    §1A = Gambali di Diamante
    
    §7Sono pensati per terreni ardenti.

  page7: |
    §6Stivali di Ghiaccio Eterno
    §7Ricetta:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Scheggia di Ghiaccio Eterno
    §1C = Nucleo di Glacialis
    §1A = Stivali di Diamante
    
    §7Gli stivali sono essenziali per
    resistere al calore.

  page8: |
    §4La dimensione successiva
    §7Un mondo dimenticato e §Divorato dal Nether§7 
    che conduce a un reame di calore infernale.
    
    §7Lì i nemici sono ancora più forti, con
    salute e danni moltiplicati.
    
    §7Con il set completo di Ghiaccio Eterno
    sarai pronto per le fiamme infernali.

  page9: |
    §4Reame Ardente
    §7Costruzione:
    §2[W] [W] [W] [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [W] [W] [W]
    
    §1W = Blocco di Verruca del Nether
    §1Accendilo con acciarino e selce

  page10: |
    §4Il Reame Ardente
    Puoi raggiungere questo posto solo con l'armatura di Ghiaccio Eterno.
    Se decidi di entrare senza, brucerai a morte.

guide_heat:
  book_title: "Guida di Sopravvivenza Ardente"
  book_author: "Archivi di Aeternum"

  page1: |
    §4§lREAME ARDENTE
    §cHai attraversato nel Reame Ardente.

    §6Qui l'aria brucia, la pietra sanguina fuoco
    e niente vuole che tu resti vivo.
    §4Questo reame potrebbe essere la fine del tuo viaggio…
    §c…o il luogo in cui rinasci tra le fiamme.

  page2: |
    §6§lSOPRAVVIVENZA DI BASE

    §8• §cIl calore costante §6ti consumerà
    senza una protezione adeguata.
    §8• §6Non venire mai senza §acibo§6, §ablocchi §6e
    §apozioni §6pronte.
    §8• §cNon venire da solo §6se non conosci ancora
    i segreti di questo reame.

  page3: |
    §3§lARMADURA FORGIATA D'INVERNO

    §6Solo il set completo di §1Ghiaccio Eterno §6può resistere
    al clima estremo.
    §cSenza il set§6, fuoco e lava
    ti scioglieranno senza pietà.
    §1Con esso§6, puoi camminare attraverso le fiamme
    come se fossero pietra solida.

  page4: |
    §4§lCREATURE DEL REAME

    §8• §6I mob qui sono approssimativamente
    §c4 volte più forti.
    §8• §6Hanno §cpiù salute§6, §cpiù danno §6e quasi
    tutti infliggono §cdanni da fuoco§6.
    §8• §6Ci sono varianti infuocate.
    §cse li sottovaluti, muori.

  page5: |
    §6§lBOTTINO E RISCHIO

    §8• §6Rovine e torri nascondono equipaggiamento con
    incantesimi molto al di sopra del normale.
    §8• §6È il miglior bottino in §5Aeternum§6
    §aSe sei arrivato fin qui, hai già dimostrato il tuo coraggio.
    §2Ora dimostra di essere capace
    di tornare vivo.

